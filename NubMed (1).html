/* ══════════════════════════════════════════════════════════════
   🖨️  REMOTE PRINT — ส่งคำสั่งพิมพ์ข้ามเครือข่ายผ่าน Firebase
   ══════════════════════════════════════════════════════════════
   วิธีตั้งค่า Firebase (ทำครั้งเดียว):
   1. ไปที่ https://console.firebase.google.com → สร้าง Project
   2. Realtime Database → สร้าง Database (เลือก Test Mode)
   3. คัดลอก URL (เช่น https://xxxx-default-rtdb.asia-southeast1.firebasedatabase.app)
   4. ใส่ใน REMOTE_PRINT_FB_URL ด้านล่าง หรือกรอกผ่านหน้า UI
   ══════════════════════════════════════════════════════════════ */

const REMOTE_PRINT_FB_URL_KEY="nubmed_fb_url";
const REMOTE_PRINT_ROOM_KEY="nubmed_print_room";
const DEFAULT_FB_URL="https://nubmedprint-default-rtdb.asia-southeast1.firebasedatabase.app";

function loadFbUrl(){try{return localStorage.getItem(REMOTE_PRINT_FB_URL_KEY)||DEFAULT_FB_URL;}catch{return DEFAULT_FB_URL;}}
function saveFbUrl(url){try{localStorage.setItem(REMOTE_PRINT_FB_URL_KEY,url||DEFAULT_FB_URL);}catch{}}
function loadPrintRoom(){try{return localStorage.getItem(REMOTE_PRINT_ROOM_KEY)||"opd1";}catch{return "opd1";}}
function savePrintRoom(r){try{localStorage.setItem(REMOTE_PRINT_ROOM_KEY,r);}catch{}}

let _fbApp=null;
function getFbDb(fbUrl){
  if(!fbUrl)return null;
  try{
    if(!_fbApp){
      _fbApp=firebase.initializeApp({databaseURL:fbUrl},"nubmed_remote");
    }
    return firebase.database(_fbApp);
  }catch(e){
    // ถ้า app มีอยู่แล้วให้ใช้ app เดิม
    try{
      const existing=firebase.app("nubmed_remote");
      return firebase.database(existing);
    }catch{return null;}
  }
}

/* ── ส่งคำสั่งพิมพ์ (เครื่องที่ไม่มีปริ้นเตอร์) ── */
async function remotePrintSend(htmlContent,fbUrl,room,onStatus){
  const db=getFbDb(fbUrl);
  if(!db){onStatus("error","❌ ไม่ได้ตั้งค่า Firebase URL");return;}
  onStatus("loading","⏳ กำลังส่งคำสั่งพิมพ์...");
  try{
    const jobId="job_"+Date.now();
    const ref=db.ref("print_jobs/"+room+"/"+jobId);
    // Firebase จำกัด 10MB — บีบ HTML โดยตัด whitespace บางส่วน
    const compressed=htmlContent.replace(/\n\s*/g," ").replace(/\s{2,}/g," ");
    if(compressed.length>800000){
      onStatus("error","❌ เอกสารใหญ่เกินไป ลองลดช่วงวันที่");
      return;
    }
    await ref.set({
      id:jobId,
      html:compressed,
      ts:Date.now(),
      sender:navigator.userAgent.slice(0,60),
      status:"pending"
    });
    // ลบ job อัตโนมัติหลัง 10 นาที
    setTimeout(()=>{try{ref.remove();}catch{}},600000);
    onStatus("ok","✅ ส่งคำสั่งพิมพ์แล้ว! รอเครื่องปริ้นเตอร์ตอบรับ...");
  }catch(e){
    onStatus("error","❌ ส่งไม่สำเร็จ: "+(e.message||e));
  }
}

/* ── รับคำสั่งพิมพ์ (เครื่องที่ต่อปริ้นเตอร์) ── */
let _printListener=null;
function remotePrintListen(fbUrl,room,onJob,onReady){
  const db=getFbDb(fbUrl);
  if(!db){onReady(false,"❌ ไม่ได้ตั้งค่า Firebase URL");return;}
  try{
    const ref=db.ref("print_jobs/"+room);
    if(_printListener){_printListener.off();_printListener=null;}
    _printListener=ref;
    ref.on("child_added",(snap)=>{
      const job=snap.val();
      if(!job||job.status!=="pending")return;
      // อัปเดตสถานะเป็น printing
      snap.ref.update({status:"printing"});
      onJob(job);
      // ลบหลังพิมพ์ 5 วินาที
      setTimeout(()=>{try{snap.ref.remove();}catch{}},5000);
    });
    onReady(true,"✅ กำลังรอรับคำสั่งพิมพ์จาก Room: "+room);
  }catch(e){
    onReady(false,"❌ เชื่อมต่อไม่ได้: "+(e.message||e));
  }
}

function remotePrintStopListen(){
  if(_printListener){try{_printListener.off();}catch{}_printListener=null;}
}

function executePrintJob(html){
  const iframe=document.createElement("iframe");
  iframe.style.cssText="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;border:0;opacity:0;";
  document.body.appendChild(iframe);
  const doc=iframe.contentDocument||iframe.contentWindow.document;
  doc.open();doc.write(html);doc.close();
  setTimeout(()=>{
    try{iframe.contentWindow.focus();iframe.contentWindow.print();}catch(e){}
    setTimeout(()=>{try{document.body.removeChild(iframe);}catch{}},3000);
  },500);
}

function assess(conds,exp,baseDate){
  if(!exp)return{status:"รอดำเนินการ",reason:"ยังไม่ได้ระบุวันหมดอายุ"};
  const base=baseDate?new Date(baseDate):new Date();
  const dl=Math.floor((new Date(exp)-base)/86400000);
  const bc=conds.filter(c=>CONDS.find(s=>s.id===c&&s.bad));
  if(dl<0)return{status:"เสีย",reason:"หมดอายุแล้ว "+Math.abs(dl)+" วัน (อิงวันที่รับยาคืน)"};
  if(dl<180)return{status:"เสีย",reason:"เหลือน้อยกว่า 6 เดือน ("+dl+" วัน อิงวันที่รับยาคืน)"};
  if(bc.some(c=>c==="humid"||c==="broken"))return{status:"เสีย",reason:"เก็บในที่ชื้นหรือบรรจุภัณฑ์ชำรุด"};
  if(bc.length>=2)return{status:"เสีย",reason:"สภาพการเก็บไม่เหมาะสม "+bc.length+" เงื่อนไข"};
  return{status:"ดี",reason:"ผ่านเกณฑ์ เหลืออีก "+dl+" วัน"};
}

const CLOUD_GAS_URL="https://script.google.com/macros/s/AKfycbwSokjHlBEbfxFLEZNWoZRhDAiAiUvi-I9WAyLO8tXu7eAfNPbwyAsUz3KAM_yUICg/exec";
const CLOUD_SECRET="nubmed2024";

async function cloudPush(url,recs,drugDb){
  if(!url)return{ok:false,msg:"ไม่ได้ตั้งค่า Cloud URL"};
  try{
    const payload=JSON.stringify({secret:CLOUD_SECRET,records:recs,drugDb,savedAt:Date.now(),version:"NubMed_v4"});
    // Google Apps Script ต้องใช้ no-cors — ส่งผ่าน form-encoded แทน JSON
    const form=new FormData();
    form.append("payload",payload);
    await fetch(url,{method:"POST",body:form,mode:"no-cors"});
    // no-cors ไม่สามารถอ่าน response ได้ ถือว่าสำเร็จถ้าไม่ throw
    return{ok:true,msg:"บันทึก Cloud สำเร็จ · "+recs.length+" บันทึก"};
  }catch(e){return{ok:false,msg:"เชื่อมต่อไม่ได้: "+e.message};}
}
async function cloudPull(url){
  if(!url)return{ok:false,msg:"ไม่ได้ตั้งค่า Cloud URL"};
  try{
    const getUrl=url+(url.includes("?")?"&":"?")+"secret="+CLOUD_SECRET;
    const res=await fetch(getUrl,{method:"GET"});
    if(!res.ok)return{ok:false,msg:"HTTP "+res.status};
    const data=await res.json();
    if(data&&data.ok)return{ok:true,data};
    return{ok:false,msg:(data&&data.msg)||"โหลดไม่สำเร็จ"};
  }catch(e){return{ok:false,msg:"เชื่อมต่อไม่ได้: "+e.message};}
}

/* ── IMPORT: รองรับทั้ง RAW_DATA_IMPORT (เวอร์ชั่นใหม่) และ sheet อ่านได้ (เวอร์ชั่นเก่า) ── */
function importXlsx(file,existingRecs,onDone,onError){
  /* แปลงวันที่ไทย dd/mm/yyyy(พ.ศ.) → ISO */
  function parseThaDate(str){
    if(!str)return null;
    const s=String(str).trim();
    /* รูปแบบ d/m/yyyy หรือ dd/mm/yyyy */
    const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m){const y=+m[3]>2400?+m[3]-543:+m[3];return new Date(y,+m[2]-1,+m[1]).toISOString();}
    /* รูปแบบ Excel serial number */
    if(!isNaN(+s)&&+s>10000){const d=new Date(Math.round((+s-25569)*86400*1000));return d.toISOString();}
    /* รูปแบบอื่น ลอง parse ตรง */
    const d=new Date(s);if(!isNaN(d))return d.toISOString();
    return new Date().toISOString();
  }
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"binary"});
      /* ── วิธีที่ 1: RAW_DATA_IMPORT (เวอร์ชั่นใหม่ ครบข้อมูล) ── */
      const rawSheet=wb.SheetNames.find(n=>n==="RAW_DATA_IMPORT");
      if(rawSheet){
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[rawSheet],{header:1});
        if(rows.length>=2){
          const imported=[];
          const versionsFound=new Set();
          rows.slice(1).forEach(row=>{
            if(!row[0]||!row[1])return;
            const ver=String(row[0]);
            if(!ver.toLowerCase().includes("nubmed"))return;
            versionsFound.add(ver);
            try{
              const rec=JSON.parse(row[1]);
              if(!rec.id||!rec.date||!rec.patient||!Array.isArray(rec.drugs))return;
              if(rec.totalGood===undefined)rec.totalGood=rec.drugs.filter(d=>d.status==="ดี").reduce((s,d)=>s+(+d.p||0)*(+d.qty||0),0);
              if(rec.totalBad===undefined)rec.totalBad=rec.drugs.filter(d=>d.status==="เสีย").reduce((s,d)=>s+(+d.p||0)*(+d.qty||0),0);
              if(!rec.conds)rec.conds=[];
              imported.push(rec);
            }catch{}
          });
          if(imported.length){
            const existIds=new Set(existingRecs.map(r=>r.id));
            const newRecs=imported.filter(r=>!existIds.has(r.id));
            const dup=imported.length-newRecs.length;
            const merged=[...newRecs,...existingRecs].sort((a,b)=>new Date(b.date)-new Date(a.date));
            onDone(merged,newRecs.length,dup,[...versionsFound].join(", ")||"RAW");
            return;
          }
        }
      }
      /* ── วิธีที่ 2: อ่านจาก sheet "รายการยาทั้งหมด" (เวอร์ชั่นเก่า) ── */
      const drugSheet=wb.SheetNames.find(n=>n.includes("รายการยา")||n.includes("drug")||n.includes("Drug"));
      /* หรือถ้าไม่พบ ลอง sheet แรกที่ไม่ใช่ summary */
      const sheetName=drugSheet||wb.SheetNames.find(n=>!n.includes("สรุป")&&!n.includes("RAW")&&!n.includes("หน่วย"))||wb.SheetNames[0];
      if(!sheetName){onError("ไม่พบข้อมูลในไฟล์");return;}
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1});
      if(rows.length<2){onError("ไม่พบข้อมูลในไฟล์");return;}
      /* ตรวจหัว col ว่าตรงกับ format NubMed ไหม */
      const hdr=rows[0].map(c=>String(c||""));
      const colDate=hdr.findIndex(h=>h.includes("วันที่"));
      const colHN=hdr.findIndex(h=>h.toUpperCase().includes("HN"));
      const colName=hdr.findIndex(h=>h.includes("ชื่อ"));
      const colRight=hdr.findIndex(h=>h.includes("สิทธิ์"));
      const colRsn=hdr.findIndex(h=>h.includes("เหตุผล"));
      const colDrug=hdr.findIndex(h=>h.includes("ชื่อยา"));
      const colGrp=hdr.findIndex(h=>h.includes("กลุ่ม"));
      const colLot=hdr.findIndex(h=>h.includes("ล็อต")||h.includes("Lot")||h.toLowerCase().includes("lot"));
      const colExp=hdr.findIndex(h=>h.includes("หมดอายุ"));
      const colQty=hdr.findIndex(h=>h.includes("จำนวน"));
      const colUnit=hdr.findIndex(h=>h.includes("หน่วย"));
      const colPrice=hdr.findIndex(h=>h.includes("ราคา")||h.includes("ต่อหน่วย"));
      const colStatus=hdr.findIndex(h=>h.includes("สถานะ"));
      const colReason=hdr.findIndex(h=>h.includes("เหตุผลประเมิน"));
      if(colHN<0||colDrug<0){onError("รูปแบบไฟล์ไม่รองรับ\nต้องมีคอลัมน์ HN และ ชื่อยา");return;}
      /* จัดกลุ่มแถวตาม HN+วันที่ */
      const recMap={};
      rows.slice(1).forEach(row=>{
        if(!row[colHN]||!row[colDrug])return;
        const hn=String(row[colHN]||"").trim();
        const dateStr=colDate>=0?String(row[colDate]||""):"";
        const key=hn+"__"+dateStr;
        if(!recMap[key]){
          recMap[key]={
            id:Date.now()+Math.random(),
            date:parseThaDate(dateStr),
            patient:{
              hn,
              nm:colName>=0?String(row[colName]||"").trim():"",
              sex:"ไม่ระบุ",
              right:colRight>=0?String(row[colRight]||"").trim():"",
              rsn:"other",
              rdet:colRsn>=0?String(row[colRsn]||"").trim():"",
              date:parseThaDate(dateStr)?.slice(0,10)||""
            },
            conds:[],drugs:[],totalGood:0,totalBad:0
          };
        }
        const drugName=String(row[colDrug]||"").trim();
        if(!drugName)return;
        const status=colStatus>=0?String(row[colStatus]||"").trim():"รอดำเนินการ";
        const qty=colQty>=0?+Number(row[colQty]||1):1;
        const price=colPrice>=0?+Number(row[colPrice]||0):0;
        const drug={
          id:Date.now()+Math.random(),
          n:drugName,
          g:colGrp>=0?String(row[colGrp]||"อื่นๆ").trim():"อื่นๆ",
          lot:colLot>=0?String(row[colLot]||"").trim():"",
          exp:colExp>=0?String(row[colExp]||"").trim():"",
          qty,u:colUnit>=0?String(row[colUnit]||"เม็ด").trim():"เม็ด",
          p:price,
          status:status==="ดี"?"ดี":"เสีย",
          reason:colReason>=0?String(row[colReason]||"").trim():""
        };
        recMap[key].drugs.push(drug);
        if(drug.status==="ดี")recMap[key].totalGood+=price*qty;
        else recMap[key].totalBad+=price*qty;
      });
      const imported=Object.values(recMap).filter(r=>r.drugs.length>0);
      if(!imported.length){onError("ไม่พบข้อมูลที่นำเข้าได้\nตรวจสอบว่าไฟล์มีคอลัมน์ HN และ ชื่อยา");return;}
      const existIds=new Set(existingRecs.map(r=>r.id));
      const newRecs=imported.filter(r=>!existIds.has(r.id));
      const dup=imported.length-newRecs.length;
      const merged=[...newRecs,...existingRecs].sort((a,b)=>new Date(b.date)-new Date(a.date));
      onDone(merged,newRecs.length,dup,"เวอร์ชั่นเก่า");
    }catch(e){onError("ไม่สามารถอ่านไฟล์ได้: "+e.message);}
  };
  reader.readAsBinaryString(file);
}

function importJSON(file,existingRecs,existingDrugDb,onDone,onError){
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      let imported=[],importedDrugs=null;
      if(Array.isArray(data)){imported=data;}
      else if(data.records&&Array.isArray(data.records)){imported=data.records;if(data.drugDb&&Array.isArray(data.drugDb))importedDrugs=data.drugDb;}
      else{onError("รูปแบบไฟล์ไม่ถูกต้อง");return;}
      const valid=imported.filter(r=>r&&r.id&&r.date&&r.patient&&Array.isArray(r.drugs));
      if(!valid.length&&!importedDrugs){onError("ไม่พบข้อมูลที่ถูกต้องในไฟล์");return;}
      const existIds=new Set(existingRecs.map(r=>r.id));
      const newRecs=valid.filter(r=>!existIds.has(r.id));
      const dup=valid.length-newRecs.length;
      const merged=[...newRecs,...existingRecs].sort((a,b)=>new Date(b.date)-new Date(a.date));
      onDone(merged,newRecs.length,dup,importedDrugs);
    }catch(e){onError("ไฟล์เสียหายหรือรูปแบบผิด: "+e.message);}
  };
  reader.onerror=()=>onError("อ่านไฟล์ไม่ได้");
  reader.readAsText(file,"utf-8");
}

    if(!nd.n.trim()||!nd.g.trim()||nd.p===""||isNaN(+nd.p)){toast_("กรอกข้อมูลให้ครบ","err");return;}
    let upd;if(editKey){upd=drugDb.map(d=>d.n===editKey?{...nd,p:+nd.p}:d);toast_("แก้ไขยา ✓");}
    else{if(drugDb.some(d=>d.n===nd.n.trim())){toast_("ชื่อยานี้มีอยู่แล้ว","err");return;}upd=[...drugDb,{...nd,p:+nd.p}];toast_("เพิ่มยาใหม่ ✓");}
    onSave(upd);setShowForm(false);setEditKey(null);
  };
  const handleDelete=drug=>{setConfirm({title:"ยืนยันลบยา",msg:`ลบ "${drug.n}"?`,onOk:()=>{onSave(drugDb.filter(d=>d.n!==drug.n));setConfirm(null);toast_("ลบยาแล้ว","warn");}});};
  const handleImport=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:"binary"});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1});
        if(rows.length<2){toast_("ไม่พบข้อมูล","err");return;}
        const imp=rows.slice(1).filter(r=>r[0]&&r[3]!==undefined).map(r=>({n:String(r[0]).trim(),g:String(r[1]||"อื่นๆ").trim(),u:String(r[2]||"เม็ด").trim(),p:+Number(r[3]||0)})).filter(d=>d.n&&d.p>=0);
        if(!imp.length){toast_("ไม่พบข้อมูลที่ถูกต้อง","err");return;}
        const ex=new Set(drugDb.map(d=>d.n));const newD=imp.filter(d=>!ex.has(d.n));const dup=imp.length-newD.length;
        onSave([...drugDb,...newD]);toast_(`นำเข้า ${newD.length} รายการ${dup>0?` (ซ้ำ ${dup})`:""}`);}
      catch{toast_("ไฟล์ไม่ถูกต้อง ใช้ Template ที่ดาวน์โหลด","err");}
    };reader.readAsBinaryString(file);e.target.value="";
  };
  const handleReset=()=>{setConfirm({title:"รีเซ็ตฐานข้อมูลยา",msg:`กลับสู่รายการเริ่มต้น (${DRUG_DB_DEFAULT.length} รายการ)?`,onOk:()=>{onSave([...DRUG_DB_DEFAULT]);setConfirm(null);toast_("รีเซ็ตแล้ว");}});};
  return(<>
    {confirm&&<ConfirmModal title={confirm.title} msg={confirm.msg} onOk={confirm.onOk} onNo={()=>setConfirm(null)}/>}
    <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={handleImport}/>
    <NavBar back={onBack} title="💉 ฐานข้อมูลยา" right={<div style={{display:"flex",gap:5}}><button className="btn b-gh b-ic" onClick={downloadDrugTemplate} title="Template">📋</button><button className="btn b-gh b-ic" onClick={()=>fileRef.current.click()} title="นำเข้า Excel">📂</button></div>}/>
    <div className="scroll">
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",background:"linear-gradient(135deg,var(--P),var(--Pdk))",padding:"12px 16px"}}>
        {[[drugDb.length,"รายการยา","#fff"],[allGroups.length,"กลุ่มโรค","#7dd3fc"],[filtered.length,"แสดงผล","#86efac"]].map(([v,l,c])=>(
          <div key={l} style={{textAlign:"center"}}><div style={{fontSize:20,fontWeight:800,color:c}}>{v}</div><div style={{fontSize:10,color:"rgba(255,255,255,.75)"}}>{l}</div></div>
        ))}
      </div>
      <div style={{padding:"10px 12px",display:"flex",gap:6,flexWrap:"wrap",borderBottom:"1px solid var(--bdl)"}}>
        <button className="btn b-P b-sm" style={{flex:1}} onClick={openAdd}>➕ เพิ่มยาใหม่</button>
        <button className="btn b-ol b-sm" style={{flex:1}} onClick={()=>fileRef.current.click()}>📂 นำเข้า Excel</button>
        <button className="btn b-ol b-sm" style={{flex:1}} onClick={downloadDrugTemplate}>📋 Template</button>
        <button className="btn b-ol b-sm" style={{flex:1,color:"var(--R)",borderColor:"var(--R)"}} onClick={handleReset}>🔄 รีเซ็ต</button>
      </div>
      {showForm&&(
        <div style={{margin:"10px 12px",padding:14,background:editKey?"#fff9e6":"var(--Plt)",borderRadius:"var(--r2)",border:`1.5px dashed ${editKey?"var(--W)":"var(--P)"}`}}>
          <div style={{fontSize:14,fontWeight:800,color:editKey?"var(--W)":"var(--P)",marginBottom:10}}>{editKey?"✏️ แก้ไข: "+editKey:"➕ เพิ่มยาใหม่"}</div>
          <div className="fg"><label className="fl">ชื่อยา *</label><input className="fi" placeholder="เช่น Metformin 500 mg" value={nd.n} onChange={e=>setNd({...nd,n:e.target.value})}/></div>
          <div className="f2">
            <div className="fg"><label className="fl">กลุ่มโรค *</label><input className="fi" list="grp-list" placeholder="เช่น เบาหวาน" value={nd.g} onChange={e=>setNd({...nd,g:e.target.value})}/><datalist id="grp-list">{allGroups.map(g=><option key={g} value={g}/>)}</datalist></div>
            <div className="fg"><label className="fl">หน่วย *</label><select className="fi fsel" value={nd.u} onChange={e=>setNd({...nd,u:e.target.value})}>{UNITS.map(u=><option key={u}>{u}</option>)}</select></div>
          </div>
          <div className="fg"><label className="fl">ราคา/หน่วย (บาท) *</label><input className="fi" type="number" min="0" step="0.01" placeholder="0.00" value={nd.p} onChange={e=>setNd({...nd,p:e.target.value})}/></div>
          <div className="fbtns"><button className="btn b-ol b-md" onClick={()=>{setShowForm(false);setEditKey(null);}}>ยกเลิก</button><button className={`btn b-md ${editKey?"b-T":"b-P"}`} style={{flex:1}} onClick={handleSave}>{editKey?"💾 บันทึก":"✅ เพิ่มยา"}</button></div>
        </div>
      )}
      <div style={{padding:"10px 12px 6px"}}>
        <input className="fi" placeholder="🔍 ค้นหาชื่อยา หรือ กลุ่มโรค..." value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:8}}/>
        <div className="chip-scroll">
          {["all",...allGroups].map(g=>(<button key={g} className="chip" onClick={()=>setSelGrp(g)} style={{background:selGrp===g?"var(--P)":"var(--bg)",color:selGrp===g?"#fff":"var(--txm)",borderColor:selGrp===g?"var(--P)":"var(--bd)"}}>{g==="all"?"🔷 ทั้งหมด":g}</button>))}
        </div>
      </div>
      {Object.entries(grouped).map(([grp,list])=>(
        <div key={grp} style={{margin:"6px 12px 10px"}}>
          <div className="dg-hdr"><span style={{color:"#fff",fontWeight:700,fontSize:13,flex:1}}>💊 {grp}</span><span style={{color:"rgba(255,255,255,.8)",fontSize:11,background:"rgba(255,255,255,.15)",padding:"1px 8px",borderRadius:10}}>{list.length} รายการ</span></div>
          <div className="dg-body">{list.map((d,i)=>(<div key={d.n} className="drug-row"><div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:700,color:"var(--tx)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.n}</div><div style={{fontSize:11,color:"var(--txm)",marginTop:1}}>{d.u} · <span style={{color:"var(--G)",fontWeight:700}}>฿{Number(d.p).toFixed(2)}</span>/{d.u}</div></div><div style={{display:"flex",gap:4,flexShrink:0,marginLeft:8}}><button className="btn b-ol b-sm" style={{color:"var(--P)",borderColor:"var(--P)",padding:"4px 8px",fontSize:12}} onClick={()=>openEdit(d)}>✏️</button><button className="btn b-ol b-sm" style={{color:"var(--R)",borderColor:"var(--R)",padding:"4px 8px",fontSize:12}} onClick={()=>handleDelete(d)}>✕</button></div></div>))}</div>
        </div>
      ))}
      {!filtered.length&&<div style={{textAlign:"center",padding:"48px 24px",color:"#bbb"}}><div style={{fontSize:48}}>💊</div><div style={{marginTop:8}}>ไม่พบรายการยา</div></div>}
      <div style={{margin:"4px 12px 20px",padding:14,background:"var(--Wlt)",borderRadius:"var(--r2)",border:"1px solid #ffe082"}}>
        <div style={{fontSize:13,fontWeight:800,color:"var(--W)",marginBottom:6}}>📝 วิธีนำเข้าจาก Excel</div>
        <div style={{fontSize:12,color:"#5d4037",lineHeight:1.9}}>
          <b>1.</b> กด "📋 Template" → ดาวน์โหลดแบบฟอร์ม<br/>
          <b>2.</b> กรอกข้อมูล 4 คอลัมน์: ชื่อยา | กลุ่มโรค | หน่วย | ราคา/หน่วย<br/>
          <b>3.</b> บันทึกเป็น .xlsx → กด "📂 นำเข้า Excel"<br/>
          <b>4.</b> ยาที่ชื่อซ้ำจะถูกข้ามโดยอัตโนมัติ
        </div>
      </div>
    </div>
  </>);
}

/* ── SUMMARY + DASHBOARD PAGE ── */
function SummaryPage({recs,onBack}){
  const allDates=recs.map(r=>r.date.slice(0,10)).sort();
  const defFrom=allDates[0]||new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  const defTo=allDates[allDates.length-1]||new Date().toISOString().slice(0,10);
  const [dateFrom,setDateFrom]=useState(defFrom);
  const [dateTo,setDateTo]=useState(defTo);
  const [activePreset,setActivePreset]=useState("ทั้งหมด");
  const [showRemotePrint,setShowRemotePrint]=useState(false);
  const [rpFbUrl,setRpFbUrl]=useState(loadFbUrl);
  const [rpRoom,setRpRoom]=useState(loadPrintRoom);
  const [rpMode,setRpMode]=useState("send"); // "send" | "receive"
  const [rpStatus,setRpStatus]=useState({type:"",msg:""});
  const [rpListening,setRpListening]=useState(false);
  const [rpJobCount,setRpJobCount]=useState(0);

  const setPreset=(lbl,days)=>{
    const to=new Date().toISOString().slice(0,10);
    const frm=days?new Date(Date.now()-days*86400000).toISOString().slice(0,10):defFrom;
    setDateFrom(frm);setDateTo(days?to:defTo);setActivePreset(lbl);
  };

  const filtered=recs.filter(r=>{const d=r.date.slice(0,10);return d>=dateFrom&&d<=dateTo;});
  const all=filtered.flatMap(r=>r.drugs);
  const gd=all.filter(d=>d.status==="ดี"),bd=all.filter(d=>d.status==="เสีย");
  const tg=gd.reduce((s,d)=>s+d.p*d.qty,0),tb=bd.reduce((s,d)=>s+d.p*d.qty,0),tv=tg+tb;
  const nR=filtered.length,nD=all.length;

  /* drug map */
  const dm={};all.forEach(d=>{if(!dm[d.n])dm[d.n]={n:d.n,g:d.g,gc:0,bc:0,gv:0,bv:0};if(d.status==="ดี"){dm[d.n].gc+=d.qty;dm[d.n].gv+=d.p*d.qty;}else{dm[d.n].bc+=d.qty;dm[d.n].bv+=d.p*d.qty;}});
  const rkG=Object.values(dm).filter(d=>d.gc>0).sort((a,b)=>b.gv-a.gv).slice(0,10);
  const rkB=Object.values(dm).filter(d=>d.bc>0).sort((a,b)=>b.bv-a.bv).slice(0,10);
  const rkQty=Object.values(dm).sort((a,b)=>(b.gc+b.bc)-(a.gc+a.bc)).slice(0,10);

  /* aggregations */
  const byRight={},byRsn={},byGrp={},bySex={};
  filtered.forEach(r=>{
    byRight[r.patient.right]=(byRight[r.patient.right]||0)+1;
    const k=REASONS.find(rr=>rr.id===r.patient.rsn)?.lbl||"ไม่ระบุ";
    byRsn[k]=(byRsn[k]||0)+1;
    const sx=r.patient.sex||"ไม่ระบุ";
    if(!bySex[sx])bySex[sx]={cnt:0,gv:0,bv:0};
    bySex[sx].cnt++;
    r.drugs.forEach(d=>{if(d.status==="ดี")bySex[sx].gv+=d.p*d.qty;else bySex[sx].bv+=d.p*d.qty;});
  });
  all.forEach(d=>{if(!byGrp[d.g])byGrp[d.g]={gv:0,bv:0};if(d.status==="ดี")byGrp[d.g].gv+=d.p*d.qty;else byGrp[d.g].bv+=d.p*d.qty;});
  const grpTop5=Object.entries(byGrp).sort((a,b)=>(b[1].gv+b[1].bv)-(a[1].gv+a[1].bv)).slice(0,5);
  const grpTotal=grpTop5.reduce((s,[,v])=>s+v.gv+v.bv,0);
  const rsnTop=Object.entries(byRsn).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxRsn=Math.max(...rsnTop.map(([,v])=>v),1);
  const TOP5=["#1a6b8a","#27ae60","#e67e22","#8e44ad","#e74c3c"];
  const SEX_COL={"ชาย":"#3b82f6","หญิง":"#ec4899","ไม่ระบุ":"#94a3b8"};
  const sexEntries=Object.entries(bySex).sort((a,b)=>b[1].cnt-a[1].cnt);
  const maxSex=Math.max(...sexEntries.map(([,v])=>v.cnt),1);

  /* print date range */
  const mn=dateFrom?new Date(dateFrom).toLocaleDateString("th-TH"):"-";
  const mx=dateTo?new Date(dateTo).toLocaleDateString("th-TH"):"-";

  /* dark-card style shortcuts */
  const D={
    card:{background:"rgba(255,255,255,.06)",borderRadius:14,border:"1px solid rgba(255,255,255,.1)",padding:16,marginBottom:10},
    st:{fontSize:11,fontWeight:700,color:"rgba(255,255,255,.45)",letterSpacing:.8,marginBottom:10,textTransform:"uppercase"},
    rr:{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,.06)"},
    bar:{height:6,background:"rgba(255,255,255,.1)",borderRadius:3,overflow:"hidden",flex:1},
  };

  if(!recs.length)return(<><NavBar back={onBack} title="📊 สรุปและรายงาน"/><div style={{display:"flex",flexDirection:"column",alignItems:"center",flex:1,gap:12,padding:40,color:"#bbb",textAlign:"center"}}><div style={{fontSize:48}}>📊</div><div>ยังไม่มีข้อมูล</div></div></>);

  /* ── Remote Print Modal ── */
  const RemotePrintModal=()=>{
    const stColor={ok:"#27ae60",error:"#e74c3c",loading:"#e67e22",info:"#1a6b8a"}[rpStatus.type]||"#888";
    const handleSaveSettings=()=>{saveFbUrl(rpFbUrl);savePrintRoom(rpRoom);};
    const handleSend=async()=>{
      handleSaveSettings();
      const html=buildReportHtml(filtered);
      await remotePrintSend(html,rpFbUrl,rpRoom,(type,msg)=>setRpStatus({type,msg}));
    };
    const handleStartListen=()=>{
      handleSaveSettings();
      remotePrintListen(rpFbUrl,rpRoom,(job)=>{
        setRpJobCount(c=>c+1);
        executePrintJob(job.html);
        setRpStatus({type:"ok",msg:"🖨️ กำลังพิมพ์งานที่ "+(rpJobCount+1)+"..."});
      },(ok,msg)=>{
        setRpListening(ok);
        setRpStatus({type:ok?"ok":"error",msg});
      });
    };
    const handleStopListen=()=>{remotePrintStopListen();setRpListening(false);setRpStatus({type:"info",msg:"⏹️ หยุดรับคำสั่งแล้ว"});};

    return(
      <div className="mover" onClick={e=>{if(e.target===e.currentTarget){handleStopListen();setShowRemotePrint(false);}}}>
        <div className="mbox" style={{maxWidth:440}}>
          <div className="mt">📡 Remote Print — พิมพ์ข้ามเครือข่าย</div>
          <div className="mn">ส่งคำสั่งพิมพ์จากเครื่องที่ไม่มีปริ้นเตอร์ไปยังเครื่องที่ต่อปริ้นเตอร์ผ่าน Internet</div>

          {/* Mode Toggle */}
          <div className="tog-g" style={{marginBottom:14}}>
            <button className={`tog ${rpMode==="send"?"on":""}`} onClick={()=>setRpMode("send")}>📤 โหมดส่ง (ไม่มีปริ้นเตอร์)</button>
            <button className={`tog ${rpMode==="receive"?"on":""}`} onClick={()=>setRpMode("receive")}>🖨️ โหมดรับ (ต่อปริ้นเตอร์)</button>
          </div>

          {/* Firebase Settings */}
          <div style={{background:"#f8f9fa",borderRadius:8,padding:12,marginBottom:12,border:"1px solid #e0e0e0"}}>
            <div style={{fontSize:12,fontWeight:800,color:"#444",marginBottom:8}}>⚙️ ตั้งค่า Firebase</div>
            <div className="fg" style={{marginTop:0}}>
              <label className="fl">Firebase Database URL</label>
              <input className="fi" style={{fontSize:12}} placeholder="https://xxxx-default-rtdb.asia-southeast1.firebasedatabase.app" value={rpFbUrl} onChange={e=>setRpFbUrl(e.target.value)}/>
            </div>
            <div className="fg">
              <label className="fl">ชื่อ Room <span>(เครื่องส่ง-รับต้องใช้ชื่อเดียวกัน)</span></label>
              <input className="fi" style={{fontSize:12}} placeholder="เช่น opd1, pharmacy, ward3" value={rpRoom} onChange={e=>setRpRoom(e.target.value)}/>
            </div>
            <div style={{fontSize:11,color:"#888",marginTop:6,lineHeight:1.6}}>
              💡 สมัคร Firebase ฟรี: <a href="https://console.firebase.google.com" target="_blank" rel="noreferrer" style={{color:"#1a6b8a"}}>console.firebase.google.com</a><br/>
              → สร้าง Project → Realtime Database → Test Mode → คัดลอก URL
            </div>
          </div>

          {rpMode==="send"?(
            <div>
              <div style={{background:"#e8f4f9",borderRadius:8,padding:10,marginBottom:12,fontSize:12,color:"#1a6b8a",lineHeight:1.7}}>
                <b>📤 วิธีใช้โหมดส่ง:</b><br/>
                1. ตั้งค่า Firebase URL และ Room ให้ตรงกับเครื่องที่ต่อปริ้นเตอร์<br/>
                2. เปิดเครื่องที่ต่อปริ้นเตอร์ → เลือกโหมดรับ → กด "เริ่มรอรับ"<br/>
                3. กลับมากด "📡 ส่งคำสั่งพิมพ์" ด้านล่าง
              </div>
              <div style={{fontSize:12,color:"#666",marginBottom:8}}>📄 จะส่งรายงานช่วง: <b>{mn} – {mx}</b> ({filtered.length} บันทึก)</div>
              <button className="btn b-lg" style={{background:"#e74c3c",color:"#fff"}} onClick={handleSend}>📡 ส่งคำสั่งพิมพ์</button>
            </div>
          ):(
            <div>
              <div style={{background:"#e8f8f0",borderRadius:8,padding:10,marginBottom:12,fontSize:12,color:"#27ae60",lineHeight:1.7}}>
                <b>🖨️ วิธีใช้โหมดรับ:</b><br/>
                1. ตั้งค่า Firebase URL และ Room ให้ตรงกับเครื่องที่ส่ง<br/>
                2. กด "เริ่มรอรับ" ให้เครื่องนี้รอรับคำสั่ง<br/>
                3. เมื่อรับคำสั่งแล้วจะพิมพ์อัตโนมัติทันที
              </div>
              {rpJobCount>0&&<div style={{fontSize:12,color:"#27ae60",marginBottom:8,fontWeight:700}}>✅ พิมพ์สำเร็จแล้ว {rpJobCount} งาน</div>}
              {!rpListening?(
                <button className="btn b-lg" style={{background:"#27ae60",color:"#fff"}} onClick={handleStartListen}>▶️ เริ่มรอรับคำสั่งพิมพ์</button>
              ):(
                <button className="btn b-lg" style={{background:"#e74c3c",color:"#fff"}} onClick={handleStopListen}>⏹️ หยุดรับคำสั่ง</button>
              )}
            </div>
          )}

          {/* Status */}
          {rpStatus.msg&&(
            <div style={{marginTop:12,padding:"10px 14px",background:stColor+"15",border:`1px solid ${stColor}40`,borderRadius:8,fontSize:13,color:stColor,fontWeight:600}}>
              {rpStatus.msg}
            </div>
          )}

          <div style={{marginTop:14,display:"flex",gap:8}}>
            <button className="btn b-ol b-md" style={{flex:1}} onClick={()=>{handleStopListen();setShowRemotePrint(false);setRpStatus({type:"",msg:""});}}>ปิด</button>
          </div>
        </div>
      </div>
    );
  };

  return(<><div style={{background:"#0e1c2b",minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    {/* ── Sticky Topbar ── */}
    <div style={{background:"linear-gradient(135deg,#0e1c2b,#162840)",padding:"0 14px",height:56,display:"flex",alignItems:"center",gap:10,borderBottom:"1px solid rgba(255,255,255,.08)",position:"sticky",top:0,zIndex:40,flexShrink:0}}>
      <button className="btn b-sm" style={{background:"rgba(255,255,255,.1)",color:"#fff",border:"none",minWidth:38,borderRadius:8}} onClick={onBack}>←</button>

/* ── DUPLICATE MANAGER PAGE ── */
function DupeManagerPage({recs,onSave,onBack,toast_,setCur}){
  const[selKeep,setSelKeep]=useState({});
  const[confirm,setConfirm]=useState(null);
  const[bulkMode,setBulkMode]=useState(false);
  const[selGroups,setSelGroups]=useState(new Set());

  const groups={};
  recs.forEach(r=>{
    const key=r.patient.hn.trim()+"__"+r.date.slice(0,10);
    if(!groups[key])groups[key]=[];
    groups[key].push(r);
  });
  const dupeGroups=Object.entries(groups).filter(([,list])=>list.length>1)
    .sort((a,b)=>new Date(b[1][0].date)-new Date(a[1][0].date));
  const totalDupe=dupeGroups.reduce((s,[,l])=>s+l.length-1,0);

  const toggleGrp=(key)=>setSelGroups(p=>{const n=new Set(p);n.has(key)?n.delete(key):n.add(key);return n;});
  const selectAll=()=>setSelGroups(new Set(dupeGroups.map(([k])=>k)));
  const clearSel=()=>setSelGroups(new Set());

  const keepOne=(key,keepId)=>{
    const toDelIds=groups[key].filter(r=>r.id!==keepId).map(r=>r.id);
    const updated=recs.filter(r=>!toDelIds.includes(r.id));
    onSave(updated);toast_(`✅ เก็บ 1 รายการ ลบ ${toDelIds.length} ซ้ำ`);
  };

  const doMerge=(key,srcRecs)=>{
    const list=(srcRecs||recs).filter(r=>groups[key].map(g=>g.id).includes(r.id));
    if(!list.length)return null;
    const base={...[...list].sort((a,b)=>b.drugs.length-a.drugs.length)[0]};
    const allDrugs=[];const seen=new Set();
    list.forEach(r=>r.drugs.forEach(d=>{if(!seen.has(d.id)){seen.add(d.id);allDrugs.push(d);}}));
    base.drugs=allDrugs;
    base.totalGood=allDrugs.filter(d=>d.status==="ดี").reduce((s,d)=>s+d.p*d.qty,0);
    base.totalBad=allDrugs.filter(d=>d.status==="เสีย").reduce((s,d)=>s+d.p*d.qty,0);
    return{base,delIds:new Set(list.map(r=>r.id)),cnt:allDrugs.length};
  };

  const mergeGroup=(key)=>{
    const r=doMerge(key);if(!r)return;
    const updated=[r.base,...recs.filter(x=>!r.delIds.has(x.id))].sort((a,b)=>new Date(b.date)-new Date(a.date));
    onSave(updated);toast_(`✅ ผสานรวม ${groups[key].length} บันทึก → 1 (ยา ${r.cnt} รายการ)`);
  };

  const resolveAll=()=>{
    let updated=[...recs];
    dupeGroups.forEach(([key,list])=>{
      const keepId=selKeep[key]||[...list].sort((a,b)=>b.drugs.length-a.drugs.length)[0].id;
      const toDelIds=list.filter(r=>r.id!==keepId).map(r=>r.id);
      updated=updated.filter(r=>!toDelIds.includes(r.id));
    });
    onSave(updated);toast_(`✅ จัดการ ${dupeGroups.length} กลุ่มซ้ำเรียบร้อย`);
  };

  /* ── BULK ACTIONS ── */
  const bulkKeep=()=>{
    let updated=[...recs];let cnt=0;
    selGroups.forEach(key=>{
      const list=groups[key];
      const keepId=selKeep[key]||[...list].sort((a,b)=>b.drugs.length-a.drugs.length)[0].id;
      const toDelIds=list.filter(r=>r.id!==keepId).map(r=>r.id);
      updated=updated.filter(r=>!toDelIds.includes(r.id));cnt+=toDelIds.length;
    });
    onSave(updated);toast_(`✅ เก็บดีสุด ${selGroups.size} กลุ่ม ลบ ${cnt} รายการซ้ำ`);
    setSelGroups(new Set());setBulkMode(false);
  };

  const bulkMerge=()=>{
    let updated=[...recs];let totalDrugs=0;
    selGroups.forEach(key=>{
      const r=doMerge(key,updated);if(!r)return;
      totalDrugs+=r.cnt;
      updated=[r.base,...updated.filter(x=>!r.delIds.has(x.id))];
    });
    updated.sort((a,b)=>new Date(b.date)-new Date(a.date));
    onSave(updated);toast_(`✅ ผสานรวม ${selGroups.size} กลุ่ม รวม ${totalDrugs} รายการยา`);
    setSelGroups(new Set());setBulkMode(false);
  };

  const bulkDeleteAll=()=>{
    let updated=[...recs];let cnt=0;
    selGroups.forEach(key=>{
      const toDelIds=groups[key].map(r=>r.id);
      updated=updated.filter(r=>!toDelIds.includes(r.id));cnt+=toDelIds.length;
    });
    onSave(updated);toast_(`🗑️ ลบ ${cnt} บันทึกใน ${selGroups.size} กลุ่ม`,"warn");
    setSelGroups(new Set());setBulkMode(false);
  };

  const selCount=selGroups.size;
  const selTotalRecs=dupeGroups.filter(([k])=>selGroups.has(k)).reduce((s,[,l])=>s+l.length,0);
  const selTotalExtra=dupeGroups.filter(([k])=>selGroups.has(k)).reduce((s,[,l])=>s+l.length-1,0);

  return(<>
    {confirm&&<ConfirmModal title={confirm.title} msg={confirm.msg} onOk={confirm.onOk} onNo={()=>setConfirm(null)}/>}
    <NavBar back={onBack} title="🔍 จัดการรายการซ้ำ"
      right={dupeGroups.length>0&&(
        <button className="btn b-gh b-sm" style={{fontSize:11,padding:"5px 10px"}}
          onClick={()=>{setBulkMode(!bulkMode);clearSel();}}>
          {bulkMode?"✕ ยกเลิก":"☑️ เลือกหลายกลุ่ม"}
        </button>
      )}/>

    <div className="scroll">
      {dupeGroups.length===0?(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:14,padding:"64px 24px",color:"#bbb",textAlign:"center"}}>
          <div style={{fontSize:56}}>✅</div>
          <div style={{fontSize:16,fontWeight:700,color:"var(--G)"}}>ไม่พบรายการซ้ำ</div>
          <div style={{fontSize:13}}>ข้อมูลทั้งหมดไม่มีการซ้ำกัน</div>
        </div>
      ):(
        <>
          {/* ── BULK MODE TOOLBAR ── */}
          {bulkMode?(
            <div style={{margin:"10px 12px 6px",borderRadius:"var(--r2)",overflow:"hidden",border:"2px solid var(--P)"}}>
              {/* Header bar */}
              <div style={{background:"linear-gradient(135deg,var(--P),var(--Pdk))",padding:"12px 14px"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:selCount>0?10:0}}>
                  <div style={{flex:1,fontSize:14,fontWeight:800,color:"#fff"}}>
                    {selCount>0?`☑️ เลือก ${selCount} กลุ่ม (${selTotalRecs} บันทึก)`:"กรุณาเลือกกลุ่มด้านล่าง"}
                  </div>
                  <button className="btn b-sm" style={{background:"rgba(255,255,255,.22)",color:"#fff",border:"1px solid rgba(255,255,255,.35)",fontSize:11}} onClick={selectAll}>เลือกทั้งหมด ({dupeGroups.length})</button>
                  {selCount>0&&<button className="btn b-sm" style={{background:"rgba(255,255,255,.1)",color:"rgba(255,255,255,.8)",border:"none",fontSize:11}} onClick={clearSel}>ล้าง</button>}
                </div>
                {selCount>0&&(
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    <button className="btn b-sm" style={{flex:1,minWidth:80,background:"#27ae60",color:"#fff",border:"none",fontSize:12,padding:"8px 4px"}}
                      onClick={()=>setConfirm({title:"เก็บรายการดีสุด",msg:`เก็บ 1 บันทึกที่มียามากสุดในแต่ละกลุ่ม ลบส่วนที่เหลือ ${selTotalExtra} รายการ จาก ${selCount} กลุ่ม?`,onOk:()=>{bulkKeep();setConfirm(null);}})}>
                      ✅ เก็บดีสุด
                    </button>
                    <button className="btn b-sm" style={{flex:1,minWidth:80,background:"var(--T)",color:"#fff",border:"none",fontSize:12,padding:"8px 4px"}}
                      onClick={()=>setConfirm({title:"ผสานรวมที่เลือก",msg:`ผสานรวมยาจากทุกบันทึกใน ${selCount} กลุ่ม (${selTotalRecs} บันทึก) → ${selCount} บันทึกรวม?`,onOk:()=>{bulkMerge();setConfirm(null);}})}>
                      🔀 ผสานรวม
                    </button>
                    <button className="btn b-sm" style={{flex:1,minWidth:80,background:"var(--R)",color:"#fff",border:"none",fontSize:12,padding:"8px 4px"}}
                      onClick={()=>setConfirm({title:"⚠️ ลบทั้งกลุ่ม",msg:`ลบบันทึกทั้งหมด ${selTotalRecs} รายการ ใน ${selCount} กลุ่ม? การกระทำนี้ไม่สามารถย้อนได้`,onOk:()=>{bulkDeleteAll();setConfirm(null);}})}>
                      🗑️ ลบทั้งกลุ่ม
                    </button>
                  </div>
                )}
              </div>
              {/* Summary strip */}
              <div style={{background:"#eaf5fb",padding:"8px 14px",fontSize:12,color:"var(--P)",display:"flex",gap:16,flexWrap:"wrap"}}>
                <span>📌 รวม <b>{dupeGroups.length}</b> กลุ่มซ้ำ</span>
                <span>📋 บันทึกเกิน <b>{totalDupe}</b> รายการ</span>
                {selCount>0&&<span style={{color:"var(--G)",fontWeight:700}}>✅ เลือกแล้ว {selCount} กลุ่ม</span>}
              </div>
            </div>
          ):(
            /* ── NORMAL SUMMARY ── */
            <div style={{margin:"12px 12px 6px",padding:"14px 16px",background:"var(--Rlt)",borderRadius:"var(--r2)",border:"2px solid var(--R)"}}>
              <div style={{fontSize:15,fontWeight:800,color:"var(--R)",marginBottom:4}}>⚠️ พบ {dupeGroups.length} กลุ่มซ้ำ ({totalDupe} บันทึกเกิน)</div>
              <div style={{fontSize:12,color:"#666",lineHeight:1.8}}>
                ตรวจพบบันทึกที่มี <b>HN + วันที่เดียวกัน</b> มากกว่า 1 รายการ<br/>
                กด <b>☑️ เลือกหลายกลุ่ม</b> เพื่อจัดการพร้อมกันหลายกลุ่ม
              </div>
              <button className="btn b-R b-md" style={{marginTop:12,width:"100%"}}
                onClick={()=>setConfirm({title:"แก้ไขซ้ำทั้งหมด",msg:`เก็บรายการที่มียามากสุดในแต่ละกลุ่ม ลบที่เหลือ ${totalDupe} บันทึก ใช่ไหม?`,onOk:()=>{resolveAll();setConfirm(null);}})}>
                🗑️ แก้ไขซ้ำทั้งหมดอัตโนมัติ ({totalDupe} บันทึก)
              </button>
            </div>
          )}

          {/* ── GROUP CARDS ── */}
          {dupeGroups.map(([key,list])=>{
            const [hn]=key.split("__");
            const date=new Date(list[0].date).toLocaleDateString("th-TH",{day:"2-digit",month:"short",year:"2-digit"});
            const chosenId=selKeep[key]||[...list].sort((a,b)=>b.drugs.length-a.drugs.length)[0].id;
            const isGrpSel=selGroups.has(key);
            const borderCol=bulkMode?(isGrpSel?"var(--G)":"var(--bdl)"):"var(--R)";
            const hdBg=bulkMode?(isGrpSel?"var(--G)":"#78909c"):"var(--R)";

            return(
              <div key={key} style={{margin:"8px 12px",borderRadius:"var(--r2)",border:`2px solid ${borderCol}`,overflow:"hidden",transition:"border-color .2s"}}>
                {/* กลุ่มหัว */}
                <div style={{background:hdBg,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:bulkMode?"pointer":"default",transition:"background .2s"}}
                  onClick={bulkMode?()=>toggleGrp(key):undefined}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    {bulkMode&&(
                      <div style={{width:22,height:22,borderRadius:4,border:`2px solid ${isGrpSel?"#fff":"rgba(255,255,255,.6)"}`,background:isGrpSel?"#fff":"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:isGrpSel?"var(--G)":"transparent",fontWeight:800,flexShrink:0,transition:"all .15s"}}>
                        {isGrpSel?"✓":""}
                      </div>
                    )}
                    <div>
                      <div style={{color:"#fff",fontWeight:800,fontSize:14}}>HN {hn}</div>
                      <div style={{color:"rgba(255,255,255,.85)",fontSize:11,marginTop:1}}>📅 {date} · {list.length} บันทึกซ้ำ · ยารวม {list.reduce((s,r)=>s+r.drugs.length,0)} รายการ</div>
                    </div>
                  </div>
                  {!bulkMode&&(
                    <button className="btn b-sm" style={{background:"rgba(255,255,255,.25)",color:"#fff",border:"none",fontSize:12}}
                      onClick={e=>{e.stopPropagation();setConfirm({title:"ผสานรวมยา",msg:`รวมยาทั้งหมด ${list.reduce((s,r)=>s+r.drugs.length,0)} รายการ จาก ${list.length} บันทึก เป็น 1 บันทึก?`,onOk:()=>{mergeGroup(key);setConfirm(null);}});}}>
                      🔀 ผสานรวม
                    </button>
                  )}
                </div>

                {/* รายการในกลุ่ม */}
                {list.map((r,i)=>{
                  const isChosen=r.id===chosenId;
                  return(
                    <div key={r.id} style={{padding:"12px 14px",borderBottom:i<list.length-1?"1px solid var(--bdl)":"none",background:isChosen&&!bulkMode?"var(--Glt)":"#fff",cursor:bulkMode?"default":"pointer",transition:"background .15s"}}
                      onClick={!bulkMode?()=>setSelKeep(p=>({...p,[key]:r.id})):undefined}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        {!bulkMode&&(
                          <div style={{width:22,height:22,borderRadius:11,border:`2px solid ${isChosen?"var(--G)":"var(--bdl)"}`,background:isChosen?"var(--G)":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:13,fontWeight:800,transition:"all .15s"}}>
                            {isChosen?"✓":""}
                          </div>
                        )}
                        <div style={{flex:1}}>
                          <div style={{fontSize:13,fontWeight:700,color:"var(--tx)"}}>{r.patient.nm||"ไม่ระบุชื่อ"}</div>
                          <div style={{fontSize:11,color:"var(--txm)",marginTop:2}}>💊 {r.drugs.length} รายการ · ✅ ฿{fmt(r.totalGood)} · ❌ ฿{fmt(r.totalBad)}</div>
                          <div style={{fontSize:10,color:"#bbb",marginTop:2}}>ID: {String(r.id).slice(-6)} · บันทึก {new Date(r.date).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}</div>
                        </div>
                        <button className="btn b-sm" style={{background:"var(--Plt)",color:"var(--P)",border:"1px solid var(--P)",fontSize:11,padding:"4px 8px",flexShrink:0}}
                          onClick={e=>{e.stopPropagation();setCur(r);onBack();}}>
                          ดู
                        </button>
                      </div>
                    </div>
                  );
                })}

                {/* ปุ่มเก็บที่เลือก (normal mode only) */}
                {!bulkMode&&(
                  <div style={{padding:"10px 14px",background:"var(--bg)",display:"flex",gap:8}}>
                    <button className="btn b-G b-sm" style={{flex:1}}
                      onClick={()=>setConfirm({title:"ยืนยันเก็บรายการ",msg:`เก็บ 1 รายการที่เลือก ลบ ${list.length-1} รายการที่เหลือ?`,onOk:()=>{keepOne(key,chosenId);setConfirm(null);}})}>
                      ✅ เก็บรายการที่เลือก
                    </button>
                  </div>
                )}
              </div>
            );
          })}

          {/* Bulk mode bottom action bar */}
          {bulkMode&&selCount>0&&(
            <div style={{position:"sticky",bottom:0,margin:"0 0 0",padding:"12px 16px",background:"var(--P)",display:"flex",gap:8,alignItems:"center",zIndex:50,boxShadow:"0 -4px 16px rgba(0,0,0,.2)"}}>
              <div style={{color:"#fff",fontSize:12,fontWeight:700,flex:1}}>
                {selCount} กลุ่ม · {selTotalRecs} บันทึก
              </div>
              <button className="btn b-sm" style={{background:"#27ae60",color:"#fff",border:"none",fontSize:12}}
                onClick={()=>setConfirm({title:"เก็บรายการดีสุด",msg:`เก็บ 1 บันทึกดีสุด ลบ ${selTotalExtra} รายการซ้ำ ใน ${selCount} กลุ่ม?`,onOk:()=>{bulkKeep();setConfirm(null);}})}>
                ✅ เก็บดีสุด
              </button>
              <button className="btn b-sm" style={{background:"var(--T)",color:"#fff",border:"none",fontSize:12}}
                onClick={()=>setConfirm({title:"ผสานรวม",msg:`ผสานรวม ${selCount} กลุ่ม?`,onOk:()=>{bulkMerge();setConfirm(null);}})}>
                🔀 รวม
              </button>
              <button className="btn b-sm" style={{background:"var(--R)",color:"#fff",border:"none",fontSize:12}}
                onClick={()=>setConfirm({title:"⚠️ ลบทั้งกลุ่ม",msg:`ลบ ${selTotalRecs} บันทึก ใน ${selCount} กลุ่ม?`,onOk:()=>{bulkDeleteAll();setConfirm(null);}})}>
                🗑️ ลบ
              </button>
            </div>
          )}
          <div style={{height:20}}/>
        </>
      )}
    </div>
  </>);
}

/* ── DETAIL PRINT MODAL — พิมพ์จากหน้ารายละเอียดบันทึก ── */
function DetailPrintModal({rec,rpListening,rpRoom,onClose,onToast}){
  const [pw,setPw]=useState(94);
  const [ph,setPh]=useState(74);
  const [pwStr,setPwStr]=useState("94");
  const [phStr,setPhStr]=useState("74");
  const sizePresets=[[94,74,"94×74"],[80,0,"ม้วน 80"],[58,0,"ม้วน 58"],[105,148,"A6"],[148,210,"A5"],[210,297,"A4"]];
  const sess={
    pt:{hn:rec.patient.hn,nm:rec.patient.nm,right:rec.patient.right},
    items:rec.drugs.map(d=>({...d,goodQty:d.status==="ดี"?d.qty:0,badQty:d.status==="เสีย"?d.qty:0})),
    date:rec.date,note:rec.patient.rdet||""
  };
  const selectPreset=(w,h)=>{setPw(w);setPh(h);setPwStr(String(w));setPhStr(String(h));};
  const doPrint=()=>{printMedCountSticker(sess,pw,ph);};
  const doRemote=async()=>{
    const html=buildMCStickerHtml(sess,pw,ph);
    await remotePrintSend(html,DEFAULT_FB_URL,rpRoom,(type,msg)=>onToast(msg,type==="ok"?"ok":"err"));
  };
  return(
    <div className="mover" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="mbox" style={{maxWidth:420}}>
        <div className="mt">🖨️ พิมพ์รายละเอียดบันทึก</div>
        <div className="mn">HN {rec.patient.hn} · {rec.patient.nm}</div>
        <div style={{fontSize:12,fontWeight:700,color:"#555",marginBottom:6}}>📄 ขนาดกระดาษ</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
          {sizePresets.map(([w,h,lbl])=>(
            <button key={lbl} className="btn b-sm"
              style={{background:pw===w&&ph===h?"var(--V)":"var(--bg)",color:pw===w&&ph===h?"#fff":"var(--txm)",border:`1.5px solid ${pw===w&&ph===h?"var(--V)":"var(--bd)"}`,padding:"6px 12px",fontSize:12}}
              onClick={()=>selectPreset(w,h)}>
              {lbl}
            </button>
          ))}
        </div>
        <div style={{display:"flex",gap:10,marginBottom:14}}>
          <div style={{flex:1}}>
            <label className="fl">กว้าง (mm)</label>
            <input className="fi" inputMode="numeric" value={pwStr}
              onChange={e=>{const v=e.target.value.replace(/\D/g,"");setPwStr(v);if(v)setPw(Number(v));}}
              onBlur={()=>{if(!pwStr||pwStr==="0"){setPwStr("94");setPw(94);}}}/>
          </div>
          <div style={{flex:1}}>
            <label className="fl">สูง (mm) <span style={{fontSize:11,fontWeight:500,color:"var(--P)"}}>0=auto</span></label>
            <input className="fi" inputMode="numeric" value={phStr}
              onChange={e=>{const v=e.target.value.replace(/\D/g,"");setPhStr(v);setPh(v?Number(v):0);}}
              onBlur={()=>{if(!phStr)setPhStr("0");}}/>
          </div>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <button className="btn b-lg" style={{flex:1,background:"#6c3483",color:"#fff"}} onClick={doPrint}>🖨️ พิมพ์เครื่องนี้</button>
          <button className="btn b-lg" style={{flex:1,background:rpListening?"#27ae60":"#888",color:"#fff"}} onClick={doRemote}>
            📡 {rpListening?"ส่งพิมพ์":"ส่ง"}
          </button>
        </div>
        {rpListening&&<div style={{fontSize:11,color:"#27ae60",textAlign:"center",marginBottom:8}}>🟢 เครื่องรับพิมพ์พร้อม (Room: {rpRoom})</div>}
        <div style={{marginTop:8}}>
          <button className="btn b-ol b-md" style={{width:"100%"}} onClick={onClose}>ปิด</button>
        </div>
      </div>
    </div>
  );
}

          {rpListening&&<div style={{fontSize:11,color:"#27ae60",textAlign:"center",marginBottom:8}}>🟢 เครื่องรับพิมพ์พร้อม (Room: {rpRoom})</div>}
        </div>)}

        <div style={{marginTop:12}}>
          <button className="btn b-ol b-md" style={{width:"100%"}} onClick={onClose}>ข้ามและดูรายละเอียด →</button>
        </div>
      </div>
    </div>
  );
}

/* ── MAIN APP ── */
function App(){

  const [postSaveModal,setPostSaveModal]=useState(null);

  const [detailPrintModal,setDetailPrintModal]=useState(null);

  /* ── ตรวจสอบ localStorage ตอนเริ่มโปรแกรม ── */
  useEffect(()=>{

    if(!ok){
      alert("⚠️ เบราว์เซอร์นี้ไม่รองรับการจัดเก็บข้อมูล!\n\nอาจเป็นเพราะ:\n• ใช้ Private/Incognito Mode\n• เบราว์เซอร์บล็อก localStorage\n• พื้นที่จัดเก็บเต็ม\n\nกรุณาปิด Incognito Mode แล้วเปิดใหม่");
    }
  },[]);

  /* ── Auto-start Remote Print listener ตั้งแต่เปิดแอป ── */
  useEffect(()=>{
    const room=loadPrintRoom();
    setRpRoom(room);
    remotePrintListen(DEFAULT_FB_URL,room,(job)=>{
      setRpJobCount(c=>c+1);
      executePrintJob(job.html);
    },(ok,msg)=>{
      setRpListening(ok);
    });
    return()=>remotePrintStopListen();
  },[]);

  /* ── Auto Pull จาก Cloud ตอนเปิดแอป (บังคับ replace local ด้วย Sheet) ── */
  useEffect(()=>{
    const autoPull=async()=>{
      const url=loadCloudUrl();
      if(!url)return;
      setCloudStatus("☁️ กำลังดึงข้อมูลจาก Cloud...");
      const r=await cloudPull(url);
      if(r.ok&&r.data){
        const remote=r.data.records||[];
        /* บังคับ replace — ลบ local เดิมทิ้ง ใช้ Sheet เท่านั้น */
        const sorted=remote.sort((a,b)=>new Date(b.date)-new Date(a.date));
        saveRecs(sorted);
        setRecs(sorted);
        setCloudStatus("☁️ โหลดจาก Sheet สำเร็จ ("+sorted.length+" บันทึก)");
        if(r.data.drugDb&&Array.isArray(r.data.drugDb)&&r.data.drugDb.length>0){
          saveDrugDb(r.data.drugDb);setDrugDb(r.data.drugDb);
        }
      }else{
        /* Pull ไม่สำเร็จ ใช้ local ที่มีไปก่อน */
        setCloudStatus("⚠️ ดึงข้อมูลไม่สำเร็จ ใช้ข้อมูล local แทน");
      }
    };
    autoPull();
  },[]);

  /* ── Auto Push ทุก 15 วินาที ── */
  useEffect(()=>{
    const interval=setInterval(async()=>{
      const r=await cloudPush(CLOUD_GAS_URL,recs,drugDb);
      if(r.ok)setCloudStatus("☁️ Auto-sync "+new Date().toLocaleTimeString("th-TH"));
      else setCloudStatus("⚠️ Auto-sync ล้มเหลว");
    },15*1000);
    return()=>clearInterval(interval);
  },[recs,drugDb]);

  /* ── Push ก่อนปิดโปรแกรม ── */

  },[recs,drugDb]);

  const handleImportRecs=e=>{

  };

                <button className="btn b-ol b-sm" style={{color:"var(--P)",borderColor:"var(--P)"}} onClick={()=>startEdit(d)}>✏️ แก้ไข</button>

                <button className="btn b-ol b-sm" style={{color:"var(--R)",borderColor:"var(--R)"}} onClick={()=>{if(editingId===d.id){setEditingId(null);setShowForm(false);setNd({...EMPTY_D});}setDrugs(p=>p.filter(x=>x.id!==d.id));}}>✕ ลบ</button>
              </div>
            </div>))}
          </div>))}
          {showForm&&(<div className={`dfbox ${editingId?"editing":""}`}>
            <div className={`dft ${editingId?"editing":""}`}>{editingId?"✏️ แก้ไขรายการยา":"➕ เพิ่มรายการยา"}</div>
            {editingId&&<div style={{fontSize:12,color:"var(--W)",marginBottom:10,background:"#fff9e6",padding:"6px 10px",borderRadius:6,border:"1px solid #f9d97d"}}>⚠️ แก้ไข: <b>{nd.n}</b></div>}
            <div className="fg"><label className="fl">ชื่อยา * <span>(พิมพ์บางส่วนได้)</span></label><AutoComplete val={nd.n} onChange={v=>setNd({...nd,n:v})} onSel={d=>setNd({...nd,n:d.n,g:d.g,u:d.u,p:d.p})}/></div>
            <div className="f2">
              <div className="fg"><label className="fl">จำนวน *</label><input className="fi" type="number" min="1" value={nd.qty} onChange={e=>setNd({...nd,qty:e.target.value})}/></div>
              <div className="fg"><label className="fl">หน่วย</label><select className="fi fsel" value={nd.u} onChange={e=>setNd({...nd,u:e.target.value})}>{UNITS.map(u=><option key={u}>{u}</option>)}</select></div>
            </div>
            <div className="fg"><label className="fl">เลขล็อต</label><input className="fi" placeholder="Lot number" value={nd.lot} onChange={e=>setNd({...nd,lot:e.target.value})}/></div>
            <div className="fg"><label className="fl">วันหมดอายุ *</label><input className="fi" type="date" value={nd.exp} onChange={e=>setNd({...nd,exp:e.target.value})}/></div>
            <div className="fg"><label className="fl">ราคาต่อหน่วย (บาท) *</label><input className="fi" type="number" min="0" step="0.01" placeholder="0.00" value={nd.p} onChange={e=>setNd({...nd,p:e.target.value})}/></div>
            <div className="fg"><label className="fl">กลุ่มโรค</label><div style={{fontSize:13,color:"var(--P)",padding:"6px 0"}}>🏷️ {nd.g}</div></div>
            <div className="fbtns"><button className="btn b-ol b-md" onClick={closeForm}>ยกเลิก</button><button className={`btn b-md ${editingId?"b-T":"b-P"}`} style={{flex:1}} onClick={addDrug}>{editingId?"💾 บันทึกแก้ไข":"✅ ประเมินและเพิ่ม"}</button></div>
          </div>)}
          {!showForm&&<button className="dadd" onClick={()=>{setEditingId(null);setNd({...EMPTY_D});setShowForm(true);}}>➕ เพิ่มรายการยา</button>}
          {drugs.length>0&&!showForm&&(<div className="dmini"><div style={{color:"var(--G)"}}>✅ ยาดี {goodNow.length} รายการ · ฿{fmt(goodNow.reduce((s,d)=>s+d.p*d.qty,0))}</div><div style={{color:"var(--R)"}}>❌ ยาเสีย {badNow.length} รายการ · ฿{fmt(badNow.reduce((s,d)=>s+d.p*d.qty,0))}</div></div>)}
          <div ref={btm}/>
          <div className="fbtns"><button className="btn b-ol b-md" onClick={()=>setStep(2)}>← ย้อน</button><button className="btn b-P b-md" style={{flex:1}} onClick={()=>{if(!drugs.length){toast_("เพิ่มรายการยาก่อน","err");return;}setStep(4);}}>ยืนยัน →</button></div>
        </div>)}
        {step===4&&(<div className="sec">
          <div className="sec-t">✅ ตรวจสอบก่อนบันทึก</div>
          <div className="rvbox">
            {[["HN",pt.hn],["ชื่อ",pt.nm],["เพศ",pt.sex],["สิทธิ์",pt.right],["วันที่รับยาคืน",pt.date?new Date(pt.date).toLocaleDateString("th-TH",{day:"2-digit",month:"long",year:"numeric"}):"ไม่ระบุ"]].map(([k,v])=>(<div key={k} className="rvrow"><span className="rvk">{k}</span><span className="rvv">{v}</span></div>))}
            <div className="rvrow"><span className="rvk">เหตุผล</span><span className="rvv">{REASONS.find(r=>r.id===pt.rsn)?.lbl||"-"}{pt.rdet?" ("+pt.rdet+")":""}</span></div>
          </div>
          <div className="rvbox"><div style={{fontSize:13,fontWeight:700,color:"#555",marginBottom:6}}>สภาพการเก็บยา</div>{conds.length?conds.map(c=>{const f=CONDS.find(s=>s.id===c);return<div key={c} style={{fontSize:13,marginBottom:2}}>{f?.icon} {f?.lbl}</div>;}):(<div style={{color:"#bbb",fontSize:13}}>ไม่ได้ระบุ</div>)}</div>
          <div className="scard-row">
            <div className="scard" style={{background:"var(--Glt)",borderColor:"var(--G)"}}><div style={{color:"var(--G)",fontWeight:700}}>ยาดี ✅</div><div style={{fontSize:20,fontWeight:800,color:"var(--G)"}}>{goodNow.length} รายการ</div><div style={{color:"var(--G)"}}>฿{fmt(goodNow.reduce((s,d)=>s+d.p*d.qty,0))}</div></div>
            <div className="scard" style={{background:"var(--Rlt)",borderColor:"var(--R)"}}><div style={{color:"var(--R)",fontWeight:700}}>ยาเสีย ❌</div><div style={{fontSize:20,fontWeight:800,color:"var(--R)"}}>{badNow.length} รายการ</div><div style={{color:"var(--R)"}}>฿{fmt(badNow.reduce((s,d)=>s+d.p*d.qty,0))}</div></div>
          </div>
          <div style={{background:"var(--bg)",borderRadius:"var(--r2)",padding:"12px 14px",marginBottom:12,border:"1px solid var(--bdl)"}}>
            <div style={{fontSize:13,fontWeight:700,color:"#555",marginBottom:8}}>รายการยา ({drugs.length})</div>
            {drugs.map((d,i)=>(<div key={d.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid var(--bdl)",fontSize:12}}><span style={{flex:1,color:"var(--tx)",fontWeight:600}}>{i+1}. {d.n} <span style={{color:"#aaa",fontWeight:400}}>Lot:{d.lot||"-"}</span></span><span style={{color:d.status==="ดี"?"var(--G)":"var(--R)",fontWeight:700,marginLeft:8}}>{d.status==="ดี"?"✅":"❌"} {d.qty}{d.u}</span></div>))}
          </div>
          <div className="fbtns"><button className="btn b-ol b-md" onClick={()=>setStep(3)}>← แก้ไข</button><button className={`btn b-md ${editingRec?"b-T":"b-G"}`} style={{flex:2}} onClick={saveRec} disabled={loading}>{loading?"กำลังบันทึก...":(editingRec?"💾 บันทึกการแก้ไข":"💾 บันทึก")}</button></div>
        </div>)}
      </div>
    </>)}

    {/* DETAIL */}
    {page==="detail"&&cur&&(<>
      <NavBar back={goHome} title="รายละเอียดบันทึก"
        right={<div style={{display:"flex",gap:5}}>
          <button className="btn b-sm" style={{background:"var(--Plt)",color:"var(--P)",border:"1px solid var(--P)",padding:"6px 10px"}} onClick={()=>goEdit(cur)}>✏️ แก้ไข</button>
          <button className="btn b-sm" style={{background:"var(--Rlt)",color:"var(--R)",border:"none",padding:"6px 10px"}} onClick={()=>delRec(cur.id)}>🗑️</button>
        </div>}/>
      <div className="scroll">
        {/* edit banner */}
        <div style={{margin:"8px 12px 0",padding:"8px 12px",background:"var(--Plt)",borderRadius:"var(--r1)",border:"1px solid var(--P)",display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--P)"}}>
          <span style={{fontSize:16}}>ℹ️</span>
          <span>กด <b>✏️ แก้ไข</b> เพื่อแก้ไขข้อมูลในบันทึกนี้</span>
        </div>
        <div className="dsec"><div className="dt">🏥 ข้อมูลผู้ป่วย</div>
          <div className="g2">{[["HN",cur.patient.hn],["ชื่อ",cur.patient.nm],["เพศ",cur.patient.sex],["สิทธิ์",cur.patient.right],["วันที่",new Date(cur.date).toLocaleDateString("th-TH")]].map(([k,v])=>(<div key={k}><div className="mk">{k}</div><div className="mv">{v}</div></div>))}</div>
          {cur.patient.rsn&&(<div style={{marginTop:10,padding:"9px 12px",background:"var(--Wlt)",borderRadius:"var(--r1)",border:"1px solid #ffe082"}}><div style={{fontSize:11,color:"#888",fontWeight:600}}>เหตุผลการคืนยา</div><div style={{fontSize:14,fontWeight:700,color:"#5d4037",marginTop:2}}>{(()=>{const rr=REASONS.find(r=>r.id===cur.patient.rsn);return rr?rr.icon+" "+rr.lbl+(cur.patient.rdet?" — "+cur.patient.rdet:""):"-";})()}</div></div>)}
        </div>
        <div className="scard-row"><div className="scard" style={{background:"var(--Glt)",borderColor:"var(--G)"}}><div style={{color:"var(--G)",fontWeight:700}}>ยาดี ✅</div><div style={{fontSize:22,fontWeight:800,color:"var(--G)"}}>฿{fmt(cur.totalGood)}</div></div><div className="scard" style={{background:"var(--Rlt)",borderColor:"var(--R)"}}><div style={{color:"var(--R)",fontWeight:700}}>ยาเสีย ❌</div><div style={{fontSize:22,fontWeight:800,color:"var(--R)"}}>฿{fmt(cur.totalBad)}</div></div></div>
        {(()=>{const grps={};cur.drugs.forEach(d=>{if(!grps[d.g])grps[d.g]=[];grps[d.g].push(d);});return Object.entries(grps).map(([g,list])=>(<div key={g} className="dsec"><div className="dt">💊 {g}</div>{list.map(d=>(<div key={d.id} className="dr" style={{borderLeftColor:d.status==="ดี"?"var(--G)":"var(--R)",marginBottom:8}}><div className="dr-top"><div className="dn">{d.n}</div><div className={`badge ${d.status==="ดี"?"g":"b"}`}>{d.status}</div></div><div className="dm">ล็อต: {d.lot||"-"} · หมดอายุ: {d.exp} · {d.qty} {d.u}</div><div className="dm">฿{Number(d.p).toLocaleString()}/{d.u} · รวม ฿{fmt(d.p*d.qty)}</div><div className="da">{d.reason}</div></div>))}</div>));})()}
        <div style={{padding:"0 12px 24px"}}><button className="btn b-G b-lg" onClick={()=>toXlsx([cur])}>📥 ดาวน์โหลด Excel</button></div>
        <div style={{padding:"0 12px 8px"}}><button className="btn b-lg" style={{background:"var(--P)",color:"#fff"}} onClick={goNewRecord}>➕ บันทึกใหม่</button></div>
        <div style={{padding:"0 12px 32px"}}><button className="btn b-lg" style={{background:"#6c3483",color:"#fff"}} onClick={()=>setDetailPrintModal(cur)}>🖨️ พิมพ์รายละเอียดบันทึก</button></div>
      </div>
    </>)}

    {page==="summary"&&<SummaryPage recs={recs} onBack={goHome}/>}
    {page==="drugdb"&&<DrugDbPage drugDb={drugDb} onSave={handleSaveDrugDb} onBack={goHome} toast_={toast_}/>}
    {page==="dupe"&&<DupeManagerPage recs={recs} onSave={r=>{saveRecs(r);setRecs(r);syncToCloud(r,drugDb);}} onBack={goHome} toast_={toast_} setCur={r=>{setCur(r);setPage("detail");}}/>}
  </div>);
}

function loadMcSessions(){try{const d=JSON.parse(localStorage.getItem(MC_KEY)||"[]");return Array.isArray(d)?d:[];}catch{return[];}}
function saveMcSessions(d){try{localStorage.setItem(MC_KEY,JSON.stringify(d));}catch{}}
