<tbody>
${goodItems.map(x=>`<tr><td class="dn">${x.n}</td><td class="qn">${x.goodQty||x.qty} ${x.u}</td><td class="sm r">${x.exp||"-"}</td><td class="sm r">฿${Number((x.goodQty||x.qty)*x.p).toLocaleString()}</td></tr>`).join("")}
<tr class="total-row"><td class="st">รวมยาดี</td><td class="qn r">${goodItems.length} รายการ</td><td></td><td class="st r" style="color:#27ae60">฿${Number(goodItems.reduce((s,x)=>s+(x.goodQty||x.qty)*x.p,0)).toLocaleString()}</td></tr>
</tbody></table>`:""}
${badItems.length>0?`
<div class="sec-title sec-b">❌ ยาเสีย – ทำลายทิ้ง (${badItems.length} รายการ)</div>
<table>
<thead><tr><th style="width:44%">ชื่อยา</th><th class="r" style="width:20%">จำนวน</th><th class="r" style="width:18%">หมดอายุ</th><th class="r" style="width:18%">มูลค่า</th></tr></thead>
<tbody>
${badItems.map(x=>`<tr><td class="dn">${x.n}</td><td class="qn">${x.badQty||0} ${x.u}</td><td class="sm r">${x.exp||"-"}</td><td class="sm r">฿${Number((x.badQty||0)*x.p).toLocaleString()}</td></tr>`).join("")}
<tr class="total-row" style="color:#a93226"><td class="st">รวมยาเสีย</td><td class="qn r">${badItems.length} รายการ</td><td></td><td class="st r">฿${Number(badItems.reduce((s,x)=>s+(x.badQty||0)*x.p,0)).toLocaleString()}</td></tr>
</tbody></table>`:""}
${note?`<div class="note-box">📝 ${note}</div>`:""}
<div class="footer">พิมพ์: ${nowStr} · NubMed v4 · Suttikeit</div>
</body></html>`;
  const w=document.createElement("iframe");
  w.style.cssText="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;border:0;opacity:0;";
  document.body.appendChild(w);
  const doc=w.contentDocument||w.contentWindow.document;
  doc.open();doc.write(html);doc.close();
  setTimeout(()=>{try{w.contentWindow.focus();w.contentWindow.print();}catch(e){}setTimeout(()=>{try{document.body.removeChild(w);}catch(e){}},2000);},500);
}

/* ── EMPTY states ── */
const EMPTY_MC_PT={hn:"",nm:"",sex:"ไม่ระบุ",right:"บัตรทอง"};
const EMPTY_MC_ITEM={n:"",g:"",lot:"",exp:"",qty:1,goodQty:1,badQty:0,u:"เม็ด",p:0,status:"ดี",note:""};

function MedCountPage({drugDb,recs,onBack,toast_}){
  const [sessions,setSessions]=useState(()=>loadMcSessions());
  const [view,setView]=useState("list"); /* list | new | detail */
  const [curSession,setCurSession]=useState(null);

  /* new session state */
  const [pt,setPt]=useState({...EMPTY_MC_PT});
  const [mcDate,setMcDate]=useState(new Date().toISOString().slice(0,10));
  const [items,setItems]=useState([]);
  const [showItemForm,setShowItemForm]=useState(false);
  const [editItemId,setEditItemId]=useState(null);
  const [nd,setNd]=useState({...EMPTY_MC_ITEM});
  const [note,setNote]=useState("");
  const [editingSession,setEditingSession]=useState(null);

  /* sticker settings */
  const [showPrintModal,setShowPrintModal]=useState(false);
  const [printSession,setPrintSession]=useState(null);
  const [paperW,setPaperW]=useState(80);
  const [paperH,setPaperH]=useState(0);

  /* remote print */
  const [showRemoteMC,setShowRemoteMC]=useState(false);
  const [remoteMCSess,setRemoteMCSess]=useState(null);
  const [rpMCRoom,setRpMCRoom]=useState(loadPrintRoom);
  const [rpMCMode,setRpMCMode]=useState("send");
  const [rpMCStatus,setRpMCStatus]=useState({type:"",msg:""});
  const [rpMCListening,setRpMCListening]=useState(false);
  const [rpMCJobCount,setRpMCJobCount]=useState(0);
  const [rpMCPaperW,setRpMCPaperW]=useState(80);
  const [rpMCPaperH,setRpMCPaperH]=useState(0);

  /* search autocomplete */
  const [drugSugg,setDrugSugg]=useState([]);
  const [showSugg,setShowSugg]=useState(false);
  const suggRef=useRef();

  const _DB=[...drugDb];

  const searchDb=q=>{if(!q)return[];const lq=q.toLowerCase();return _DB.filter(d=>d.n.toLowerCase().includes(lq)||d.g.toLowerCase().includes(lq)).slice(0,12);};

  /* ── Auto-start รับพิมพ์ทันทีเมื่อเปิดโปรแกรม ── */
  useEffect(()=>{
    const room=loadPrintRoom();
    remotePrintListen(DEFAULT_FB_URL,room,(job)=>{
      setRpMCJobCount(c=>{const n=c+1;setRpMCStatus({type:"ok",msg:"🖨️ พิมพ์งาน #"+n+" สำเร็จ"});return n;});
      executePrintJob(job.html);
    },(ok,msg)=>{
      setRpMCListening(ok);
      if(ok)setRpMCStatus({type:"ok",msg:"🟢 รอรับคำสั่งพิมพ์อยู่ (Room: "+room+")"});
      else setRpMCStatus({type:"error",msg});
    });
    return()=>remotePrintStopListen();
  },[]);

  useEffect(()=>{
    setDrugSugg(searchDb(nd.n));setShowSugg(!!nd.n&&view==="new");
  },[nd.n]);

  useEffect(()=>{
    const h=e=>{if(suggRef.current&&!suggRef.current.contains(e.target))setShowSugg(false);};
    document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);
  },[]);

  const goList=()=>{setView("list");setCurSession(null);setEditingSession(null);};
  const goNew=(editSess)=>{
    if(editSess){
      setPt({...editSess.pt});setMcDate(editSess.date.slice(0,10));
      setItems(editSess.items.map(x=>({...x})));setNote(editSess.note||"");
      setEditingSession(editSess);
    }else{
      setPt({...EMPTY_MC_PT});setMcDate(new Date().toISOString().slice(0,10));
      setItems([]);setNote("");setEditingSession(null);
    }
    setShowItemForm(false);setEditItemId(null);setNd({...EMPTY_MC_ITEM});
    setView("new");
  };

  const openItemForm=(item)=>{
    if(item){
      setNd({n:item.n,g:item.g,lot:item.lot||"",exp:item.exp||"",qty:item.qty,goodQty:item.goodQty??item.qty,badQty:item.badQty??0,u:item.u,p:item.p,status:item.status,note:item.note||""});
      setEditItemId(item.id);
    }else{
      setNd({...EMPTY_MC_ITEM});setEditItemId(null);
    }
    setShowItemForm(true);
  };

  const closeItemForm=()=>{setShowItemForm(false);setEditItemId(null);setNd({...EMPTY_MC_ITEM});};

  const saveItem=()=>{
    if(!nd.n.trim()){toast_("กรอกชื่อยา","err");return;}
    const total=+nd.goodQty+ +nd.badQty;
    const status=+nd.badQty>0&&+nd.goodQty===0?"เสีย":+nd.goodQty>0?"ดี":"เสีย";
    const item={...nd,id:editItemId||Date.now(),qty:total,goodQty:+nd.goodQty,badQty:+nd.badQty,p:+nd.p,status};
    if(editItemId){setItems(p=>p.map(x=>x.id===editItemId?item:x));toast_("แก้ไข: "+item.n);}
    else{setItems(p=>[...p,item]);toast_("เพิ่ม: "+item.n);}
    closeItemForm();
  };

  const delItem=id=>{setItems(p=>p.filter(x=>x.id!==id));toast_("ลบรายการแล้ว","warn");};

  const saveSession=()=>{
    if(!pt.hn||!pt.nm){toast_("กรอก HN และชื่อผู้ป่วย","err");return;}
    if(!items.length){toast_("เพิ่มรายการยาอย่างน้อย 1 รายการ","err");return;}
    const sess={
      id:editingSession?editingSession.id:Date.now(),
      date:mcDate?new Date(mcDate).toISOString():new Date().toISOString(),
      pt:{...pt},items:[...items],note,
      totalGood:items.filter(x=>x.status!=="เสีย"||x.goodQty>0).reduce((s,x)=>s+x.goodQty*x.p,0),
      totalBad:items.reduce((s,x)=>s+(x.badQty||0)*x.p,0),
    };
    let upd;
    if(editingSession){upd=sessions.map(s=>s.id===editingSession.id?sess:s);toast_("แก้ไขบันทึกนับยา ✓");}
    else{upd=[sess,...sessions];toast_("บันทึกการนับยา ✓");}
    saveMcSessions(upd);setSessions(upd);setCurSession(sess);setView("detail");setEditingSession(null);

    /* ── sync รายการยาไปยังระบบหลัก (recs / SK key) ── */
    try{
      const mainRecs=loadRecs();
      /* แปลง session items → drugs format ของระบบหลัก */
      const convertedDrugs=items.map(x=>({
        id:x.id,n:x.n,g:x.g||"",lot:x.lot||"",exp:x.exp||"",
        qty:x.qty||((x.goodQty||0)+(x.badQty||0)),u:x.u,p:+x.p,
        status:x.goodQty>0?"ดี":"เสีย",
        reason:x.goodQty>0?"นับยา: ยาดี ส่งคืนผู้ป่วย":"นับยา: ยาเสีย เก็บทำลาย"
      }));
      const mainRec={
        id:sess.id,
        date:sess.date,
        patient:{hn:pt.hn,nm:pt.nm,sex:"ไม่ระบุ",right:pt.right,rsn:"medcount",rdet:note||"นับยาจากห้องตรวจ",date:mcDate},
        conds:[],
        drugs:convertedDrugs,
        totalGood:convertedDrugs.filter(d=>d.status==="ดี").reduce((s,d)=>s+d.p*d.qty,0),
        totalBad:convertedDrugs.filter(d=>d.status==="เสีย").reduce((s,d)=>s+d.p*d.qty,0),
        _source:"medcount"
      };
      let updMain;
      if(editingSession){updMain=mainRecs.map(r=>r.id===editingSession.id?mainRec:r);}
      else{updMain=[mainRec,...mainRecs];}
      saveRecs(updMain);
    }catch(e){}
  };

  const delSession=id=>{
    const upd=sessions.filter(s=>s.id!==id);saveMcSessions(upd);setSessions(upd);goList();toast_("ลบบันทึกนับยาแล้ว","warn");
  };

  const openPrint=sess=>{setPrintSession(sess);setShowPrintModal(true);};
  const openRemoteMC=sess=>{setRemoteMCSess(sess);setShowRemoteMC(true);setRpMCStatus({type:"",msg:""});};

  const goodItems=items.filter(x=>x.goodQty>0);
  const badItems=items.filter(x=>(x.badQty||0)>0);

  /* ──── REMOTE PRINT MODAL (นับยา) ──── */
  const RemoteMCModal=()=>{
    const sess=remoteMCSess;
    if(!sess&&rpMCMode==="send")return null;
    const stColor={ok:"#27ae60",error:"#e74c3c",loading:"#e67e22",info:"#1a6b8a"}[rpMCStatus.type]||"#888";

    const handleSend=async()=>{
      savePrintRoom(rpMCRoom);
      const html=buildMCStickerHtml(sess,rpMCPaperW,rpMCPaperH);
      await remotePrintSend(html,DEFAULT_FB_URL,rpMCRoom,(type,msg)=>setRpMCStatus({type,msg}));
    };
    const handleStop=()=>{
      remotePrintStopListen();
      setRpMCListening(false);
      setRpMCStatus({type:"info",msg:"⏹️ หยุดรับคำสั่งแล้ว"});
    };
    const handleRestart=()=>{
      const room=rpMCRoom;
      savePrintRoom(room);
      remotePrintListen(DEFAULT_FB_URL,room,(job)=>{
        setRpMCJobCount(c=>{const n=c+1;setRpMCStatus({type:"ok",msg:"🖨️ พิมพ์งาน #"+n+" สำเร็จ"});return n;});
        executePrintJob(job.html);
      },(ok,msg)=>{
        setRpMCListening(ok);
        if(ok)setRpMCStatus({type:"ok",msg:"🟢 รอรับคำสั่งพิมพ์อยู่ (Room: "+room+")"});
        else setRpMCStatus({type:"error",msg});
      });
    };
    const closeModal=()=>{setShowRemoteMC(false);setRpMCStatus(rpMCListening?{type:"ok",msg:"🟢 รอรับคำสั่งพิมพ์อยู่ (Room: "+rpMCRoom+")"}:{type:"",msg:""});};
    const sizePresets=[[80,0,"ม้วน 80"],[58,0,"ม้วน 58"],[105,148,"A6"],[148,210,"A5"],[210,297,"A4"]];

    return(
      <div className="mover" onClick={e=>{if(e.target===e.currentTarget)closeModal();}}>
        <div className="mbox" style={{maxWidth:420}}>
          <div className="mt">📡 Remote Print</div>

          <div className="tog-g" style={{marginBottom:14}}>
            <button className={`tog ${rpMCMode==="send"?"on":""}`} onClick={()=>{setRpMCMode("send");}}>📤 ส่งพิมพ์</button>
            <button className={`tog ${rpMCMode==="receive"?"on":""}`} onClick={()=>{setRpMCMode("receive");}}>🖨️ สถานะรับ</button>
          </div>

          {/* ── โหมดส่ง ── */}
          {rpMCMode==="send"&&sess&&(<div>
            <div style={{fontSize:12,color:"#555",marginBottom:10,padding:"8px 12px",background:"#f8f9fa",borderRadius:8,border:"1px solid #e0e0e0"}}>
              👤 HN {sess.pt.hn} · {sess.pt.nm} · {sess.items.length} รายการ
            </div>

            <div className="fg" style={{marginTop:0,marginBottom:12}}>
              <label className="fl">Room <span>(ต้องตรงกับเครื่องรับ)</span></label>
              <input className="fi" placeholder="opd1" value={rpMCRoom} onChange={e=>setRpMCRoom(e.target.value)}/>
            </div>

            <div style={{fontSize:13,fontWeight:800,color:"#444",marginBottom:8}}>📄 ขนาดกระดาษ</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
              {sizePresets.map(([w,h,lbl])=>(
                <button key={lbl} className="btn b-sm"
                  style={{background:rpMCPaperW===w&&rpMCPaperH===h?"var(--V)":"var(--bg)",color:rpMCPaperW===w&&rpMCPaperH===h?"#fff":"var(--txm)",border:`1.5px solid ${rpMCPaperW===w&&rpMCPaperH===h?"var(--V)":"var(--bd)"}`,fontSize:12,padding:"6px 14px"}}
                  onClick={()=>{setRpMCPaperW(w);setRpMCPaperH(h);}}>
                  {lbl}
                </button>
              ))}
            </div>
            <div style={{display:"flex",gap:10,marginBottom:14}}>
              <div style={{flex:1}}>
                <label className="fl">กว้าง (mm)</label>
                <input className="fi" inputMode="numeric"
                  value={rpMCPaperW===0?"0":String(rpMCPaperW)}
                  onChange={e=>{const v=e.target.value.replace(/\D/g,"");setRpMCPaperW(v===""?0:Number(v));}}
                  onBlur={e=>{if(!e.target.value||e.target.value==="0")setRpMCPaperW(80);}}/>
              </div>
              <div style={{flex:1}}>
                <label className="fl">สูง (mm) <span>0=อัตโนมัติ</span></label>
                <input className="fi" inputMode="numeric"
                  value={String(rpMCPaperH)}
                  onChange={e=>{const v=e.target.value.replace(/\D/g,"");setRpMCPaperH(v===""?0:Number(v));}}/>
              </div>
            </div>
            <button className="btn b-lg" style={{background:"var(--V)",color:"#fff"}} onClick={handleSend}>📡 ส่งคำสั่งพิมพ์</button>
          </div>)}

          {/* ── โหมดรับ (แสดงสถานะ) ── */}
          {rpMCMode==="receive"&&(<div>
            <div style={{fontSize:12,color:"#555",marginBottom:12,lineHeight:1.8,background:rpMCListening?"#f0fdf4":"#fff5f5",padding:"12px 14px",borderRadius:8,border:`1px solid ${rpMCListening?"#bbf7d0":"#fecaca"}`}}>
              {rpMCListening
                ?<><span style={{fontSize:16}}>🟢</span> <b>กำลังรอรับคำสั่งพิมพ์</b><br/>Room: <b>{rpMCRoom}</b> · รับสำเร็จแล้ว <b>{rpMCJobCount}</b> งาน</>
                :<><span style={{fontSize:16}}>🔴</span> <b>หยุดรับคำสั่งอยู่</b><br/>กด ▶️ เพื่อเริ่มรับใหม่</>
              }
            </div>
            <div className="fg" style={{marginTop:0,marginBottom:12}}>
              <label className="fl">Room</label>
              <input className="fi" placeholder="opd1" value={rpMCRoom} onChange={e=>setRpMCRoom(e.target.value)}/>
            </div>
            {rpMCListening
              ?<button className="btn b-lg" style={{background:"#e74c3c",color:"#fff"}} onClick={handleStop}>⏹️ หยุดรับคำสั่ง</button>
              :<button className="btn b-lg" style={{background:"#27ae60",color:"#fff"}} onClick={handleRestart}>▶️ เริ่มรับคำสั่งใหม่</button>
            }
          </div>)}

          {/* Status */}
          {rpMCStatus.msg&&(
            <div style={{marginTop:12,padding:"10px 14px",background:stColor+"18",border:`1px solid ${stColor}50`,borderRadius:8,fontSize:13,color:stColor,fontWeight:600}}>
              {rpMCStatus.msg}
            </div>
          )}

          <div style={{marginTop:14}}>
            <button className="btn b-ol b-md" style={{width:"100%"}} onClick={closeModal}>ปิด</button>
          </div>
        </div>
      </div>
    );
  };


  /* ──── PRINT MODAL ──── */
  const [pwStr,setPwStr]=useState("80");
  const [phStr,setPhStr]=useState("0");
  const PrintModal=()=>(
    <div className="mover">
      <div className="mbox" style={{maxWidth:380}}>
        <div className="mt">🖨️ ตั้งค่าการพิมพ์สติ๊กเกอร์</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",margin:"10px 0"}}>
          {[[80,0,"ม้วน 80"],[58,0,"ม้วน 58"],[105,148,"A6"],[148,210,"A5"],[210,297,"A4"]].map(([w,h,lbl])=>(
            <button key={lbl} className="btn b-sm"
              style={{background:pwStr===String(w)&&phStr===String(h)?"var(--P)":"var(--bg)",color:pwStr===String(w)&&phStr===String(h)?"#fff":"var(--txm)",border:`1.5px solid ${pwStr===String(w)&&phStr===String(h)?"var(--P)":"var(--bd)"}`,padding:"6px 12px",fontSize:12}}
              onClick={()=>{setPwStr(String(w));setPhStr(String(h));setPaperW(w);setPaperH(h);}}>
              {lbl}
            </button>
          ))}
        </div>
        <div className="f2" style={{marginTop:4}}>
          <div className="fg"><label className="fl">กว้าง (mm)</label>
            <input className="fi" inputMode="numeric"
              value={pwStr}
              onChange={e=>{const v=e.target.value.replace(/\D/g,"");setPwStr(v);setPaperW(v===""?0:Number(v));}}
              onBlur={()=>{if(!pwStr||pwStr==="0"){setPwStr("80");setPaperW(80);}}}/>
          </div>
          <div className="fg"><label className="fl">สูง (mm) <span>0=auto</span></label>
            <input className="fi" inputMode="numeric"
              value={phStr}
              onChange={e=>{const v=e.target.value.replace(/\D/g,"");setPhStr(v);setPaperH(v===""?0:Number(v));}}
              onBlur={()=>{if(!phStr)setPhStr("0");}}/>
          </div>
        </div>
        <div className="fbtns" style={{marginTop:14}}>
          <button className="btn b-ol b-md" onClick={()=>setShowPrintModal(false)}>ยกเลิก</button>
          <button className="btn b-P b-md" style={{flex:1}} onClick={()=>{printMedCountSticker(printSession||curSession,Number(pwStr)||80,Number(phStr)||0);setShowPrintModal(false);}}>🖨️ พิมพ์</button>
        </div>
      </div>
    </div>
  );

  /* ──── LIST VIEW ──── */
  if(view==="list"){
    return(<>
      {showPrintModal&&<PrintModal/>}
      {showRemoteMC&&<RemoteMCModal/>}
      <NavBar back={onBack} title="🔢 นับยา"
        right={<div style={{display:"flex",gap:5,alignItems:"center"}}>
          <button className="btn b-sm"
            style={{background:rpMCListening?"rgba(39,174,96,.2)":"rgba(231,76,60,.15)",color:rpMCListening?"#27ae60":"#e74c3c",border:`1px solid ${rpMCListening?"#27ae60":"#e74c3c"}`,fontSize:11,padding:"5px 10px",display:"flex",alignItems:"center",gap:4}}
            onClick={()=>{setRpMCMode("receive");setRemoteMCSess(null);setShowRemoteMC(true);}}>
            <span style={{width:7,height:7,borderRadius:"50%",background:rpMCListening?"#27ae60":"#e74c3c",display:"inline-block",boxShadow:rpMCListening?"0 0 0 2px #27ae6040":""}}/>
            {rpMCListening?"รับพิมพ์อยู่":"📡 รับพิมพ์"}
          </button>
          <button className="btn b-sm" style={{background:"var(--V)",color:"#fff",border:"none",fontSize:12,padding:"6px 12px"}} onClick={()=>goNew()}>➕ นับยาใหม่</button>
        </div>}/>
      <div className="scroll">
        <div style={{margin:"12px 12px 6px",padding:"12px 14px",background:"linear-gradient(135deg,#f3e5f5,#e8d5f5)",borderRadius:"var(--r2)",border:"2px solid #9b59b6"}}>
          <div style={{fontSize:14,fontWeight:800,color:"#6c3483",marginBottom:4}}>🔢 ระบบนับยาจากห้องตรวจ</div>
          <div style={{fontSize:12,color:"#5d4037",lineHeight:1.9}}>
            รับยาเดิมจากห้องตรวจ → นับแยกยาดี/ยาเสีย<br/>
            ✅ ยาดี: ส่งคืนให้ผู้ป่วยใช้ต่อ<br/>
            ❌ ยาเสีย: เก็บเพื่อทำลาย · พิมพ์ใบสติ๊กเกอร์ได้
          </div>
        </div>
        {!sessions.length&&(
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:14,padding:"60px 24px",color:"#bbb",textAlign:"center"}}>
            <div style={{fontSize:56}}>🔢</div>
            <div style={{fontSize:16,fontWeight:700,color:"var(--V)"}}>ยังไม่มีบันทึกนับยา</div>
            <div style={{fontSize:13}}>กด ➕ นับยาใหม่ เพื่อเริ่มต้น</div>
          </div>
        )}
        {sessions.map(s=>(
          <div key={s.id} className="rcard" onClick={()=>{setCurSession(s);setView("detail");}}>
            <div style={{flex:1}}>
              <div className="rhn">HN {s.pt.hn}</div>
              <div className="rnm">{s.pt.nm}</div>
              <div className="rmta">{s.pt.right} · {s.items.length} รายการ</div>
              <div className="rdt">{new Date(s.date).toLocaleDateString("th-TH",{day:"2-digit",month:"short",year:"2-digit"})}</div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:13,fontWeight:700,color:"var(--G)"}}>✅ ฿{fmt(s.totalGood)}</div>
              <div style={{fontSize:13,fontWeight:700,color:"var(--R)"}}>❌ ฿{fmt(s.totalBad)}</div>
              <div style={{display:"flex",gap:4,marginTop:6}}>
                <button className="btn b-sm" style={{background:"#f3e5f5",color:"#6c3483",border:"1px solid #9b59b6",fontSize:11}} onClick={e=>{e.stopPropagation();openPrint(s);}}>🖨️</button>
                <button className="btn b-sm" style={{background:"rgba(26,107,138,.15)",color:"#1a6b8a",border:"1px solid #1a6b8a",fontSize:11}} onClick={e=>{e.stopPropagation();setRpMCMode("send");setRemoteMCSess(s);setShowRemoteMC(true);}}>📡</button>
              </div>
            </div>
          </div>
        ))}
        <div style={{height:32}}/>
      </div>
    </>);
  }

  /* ──── DETAIL VIEW ──── */
  if(view==="detail"&&curSession){
    const sess=curSession;
    const gList=sess.items.filter(x=>x.goodQty>0);
    const bList=sess.items.filter(x=>(x.badQty||0)>0);
    return(<>
      {showPrintModal&&<PrintModal/>}
      {showRemoteMC&&<RemoteMCModal/>}
      <NavBar back={goList} title="รายละเอียดนับยา"
        right={<div style={{display:"flex",gap:5}}>
          <button className="btn b-sm" style={{background:"var(--Plt)",color:"var(--P)",border:"1px solid var(--P)"}} onClick={()=>goNew(sess)}>✏️</button>
          <button className="btn b-sm" style={{background:"#f3e5f5",color:"#6c3483",border:"1px solid #9b59b6"}} onClick={()=>openPrint(sess)}>🖨️</button>
          <button className="btn b-sm" style={{background:"rgba(26,107,138,.15)",color:"#1a6b8a",border:"1px solid #1a6b8a"}} onClick={()=>{setRpMCMode("send");setRemoteMCSess(sess);setShowRemoteMC(true);}}>📡</button>
          <button className="btn b-sm" style={{background:"var(--Rlt)",color:"var(--R)",border:"none"}} onClick={()=>{if(window.confirm("ลบบันทึกนี้?"))delSession(sess.id);}}>🗑️</button>
        </div>}/>
      <div className="scroll">
        <div className="dsec"><div className="dt">🏥 ข้อมูลผู้ป่วย</div>
          <div className="g2">
            {[["HN",sess.pt.hn],["ชื่อ",sess.pt.nm],["สิทธิ์",sess.pt.right],["วันที่",new Date(sess.date).toLocaleDateString("th-TH")]].map(([k,v])=>(<div key={k}><div className="mk">{k}</div><div className="mv">{v}</div></div>))}
          </div>
        </div>
        <div className="scard-row">
          <div className="scard" style={{background:"var(--Glt)",borderColor:"var(--G)"}}><div style={{color:"var(--G)",fontWeight:700}}>ยาดี ✅</div><div style={{fontSize:20,fontWeight:800,color:"var(--G)"}}>{gList.length} รายการ</div><div style={{color:"var(--G)"}}>฿{fmt(sess.totalGood)}</div></div>
          <div className="scard" style={{background:"var(--Rlt)",borderColor:"var(--R)"}}><div style={{color:"var(--R)",fontWeight:700}}>ยาเสีย ❌</div><div style={{fontSize:20,fontWeight:800,color:"var(--R)"}}>{bList.length} รายการ</div><div style={{color:"var(--R)"}}>฿{fmt(sess.totalBad)}</div></div>
        </div>
        {gList.length>0&&(<div className="dsec"><div className="dt" style={{color:"var(--G)"}}>✅ ยาดี – ส่งคืนผู้ป่วย</div>
          {gList.map(x=>(<div key={x.id} className="dr" style={{borderLeftColor:"var(--G)",marginBottom:6}}>
            <div className="dr-top"><div className="dn">{x.n}</div><div className="badge g">{x.goodQty} {x.u}</div></div>
            <div className="dm">Lot: {x.lot||"-"} · หมดอายุ: {x.exp||"-"}</div>
            <div className="dm">฿{x.p}/{x.u} · รวม ฿{fmt(x.goodQty*x.p)}</div>
          </div>))}
        </div>)}
        {bList.length>0&&(<div className="dsec"><div className="dt" style={{color:"var(--R)"}}>❌ ยาเสีย – ทำลาย</div>
          {bList.map(x=>(<div key={x.id} className="dr" style={{borderLeftColor:"var(--R)",marginBottom:6}}>
            <div className="dr-top"><div className="dn">{x.n}</div><div className="badge b">{x.badQty} {x.u}</div></div>
            <div className="dm">Lot: {x.lot||"-"} · หมดอายุ: {x.exp||"-"}</div>
            <div className="dm">฿{x.p}/{x.u} · รวม ฿{fmt((x.badQty||0)*x.p)}</div>
          </div>))}
        </div>)}
        {sess.note&&(<div className="dsec"><div className="dt">📝 หมายเหตุ</div><div style={{fontSize:13,color:"#5d4037"}}>{sess.note}</div></div>)}
        <div style={{padding:"10px 12px 6px"}}>
          <button className="btn b-lg" style={{background:"var(--V)",color:"#fff"}} onClick={()=>openPrint(sess)}>🖨️ พิมพ์ใบสติ๊กเกอร์</button>
        </div>
        <div style={{padding:"0 12px 24px"}}>
          <button className="btn b-lg" style={{background:"#1a6b8a",color:"#fff"}} onClick={()=>{setRpMCMode("send");setRemoteMCSess(sess);setShowRemoteMC(true);}}>📡 ส่งพิมพ์ข้ามเครือข่าย</button>
        </div>
      </div>
    </>);
  }

  /* ──── NEW / EDIT VIEW ──── */
  return(<>
    {showPrintModal&&<PrintModal/>}
    {showRemoteMC&&<RemoteMCModal/>}
    <NavBar back={goList} title={editingSession?"✏️ แก้ไขนับยา":"🔢 นับยาใหม่"}/>
    <div className="scroll" style={{paddingBottom:100}}>
      {/* Patient Info */}
      <div className="sec">
        <div className="sec-t" style={{color:"var(--V)"}}>🏥 ข้อมูลผู้ป่วย</div>
        <div className="fg"><label className="fl">HN ผู้ป่วย *</label><input className="fi" placeholder="เลขประจำตัวผู้ป่วย" value={pt.hn} onChange={e=>setPt({...pt,hn:e.target.value})}/></div>
        <div className="fg"><label className="fl">ชื่อ-นามสกุล *</label><input className="fi" placeholder="ชื่อเต็ม" value={pt.nm} onChange={e=>setPt({...pt,nm:e.target.value})}/></div>
        <div className="f2">
          <div className="fg"><label className="fl">สิทธิ์</label><select className="fi fsel" value={pt.right} onChange={e=>setPt({...pt,right:e.target.value})}>{RIGHTS.map(r=><option key={r}>{r}</option>)}</select></div>
          <div className="fg"><label className="fl">วันที่</label>
            <input className="fi" type="date" value={mcDate} onChange={e=>setMcDate(e.target.value)}/>
          </div>
        </div>
        <div className="fg"><label className="fl">หมายเหตุ</label><input className="fi" placeholder="เช่น รับยาจากคลินิกเบาหวาน..." value={note} onChange={e=>setNote(e.target.value)}/></div>
      </div>

      {/* Drug items */}
      <div style={{padding:"0 12px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{fontSize:15,fontWeight:800,color:"var(--V)"}}>💊 รายการยา ({items.length})</div>
          {items.length>0&&<div style={{fontSize:12,color:"var(--txm)"}}>✅{goodItems.length} · ❌{badItems.length}</div>}
        </div>

        {!items.length&&!showItemForm&&(
          <div style={{textAlign:"center",padding:24,color:"#bbb",fontSize:14}}>ยังไม่มีรายการ<br/><span style={{fontSize:12}}>กด ➕ เพื่อเพิ่ม</span></div>
        )}

        {items.map(x=>(
          <div key={x.id} className="dr" style={{borderLeftColor:x.goodQty>0?"var(--G)":"var(--R)",borderLeftWidth:4,marginBottom:8}}>
            <div className="dr-top">
              <div className="dn">{x.n}</div>
              <div style={{display:"flex",gap:4}}>
                {x.goodQty>0&&<span className="badge g">✅ {x.goodQty}</span>}
                {(x.badQty||0)>0&&<span className="badge b">❌ {x.badQty}</span>}
              </div>
            </div>
            <div className="dm">Lot: {x.lot||"-"} · หมดอายุ: {x.exp||"-"} · {x.u} · ฿{x.p}</div>
            <div style={{display:"flex",gap:6,marginTop:8}}>
              <button className="btn b-ol b-sm" style={{color:"var(--P)",borderColor:"var(--P)"}} onClick={()=>openItemForm(x)}>✏️ แก้ไข</button>
              <button className="btn b-ol b-sm" style={{color:"var(--R)",borderColor:"var(--R)"}} onClick={()=>delItem(x.id)}>✕ ลบ</button>
            </div>
          </div>
        ))}

        {/* ADD/EDIT ITEM FORM */}
        {showItemForm&&(
          <div style={{background:"var(--Plt)",borderRadius:"var(--r2)",padding:14,marginBottom:12,border:"1.5px dashed var(--V)"}}>
            <div style={{fontSize:14,fontWeight:800,color:"var(--V)",marginBottom:10}}>{editItemId?"✏️ แก้ไขรายการยา":"➕ เพิ่มรายการยา"}</div>

            {/* Drug autocomplete */}
            <div className="fg" ref={suggRef}>
              <label className="fl">ชื่อยา * <span>(พิมพ์บางส่วนได้)</span></label>
              <input className="fi" placeholder="พิมพ์ชื่อยา หรือ กลุ่มโรค..." value={nd.n}
                onChange={e=>setNd({...nd,n:e.target.value})} onFocus={()=>nd.n&&setShowSugg(true)} autoComplete="off"/>
              {showSugg&&drugSugg.length>0&&(
                <div className="acd" style={{zIndex:400}}>
                  {drugSugg.map((d,i)=>(
                    <div key={i} className="aci" onMouseDown={()=>{setNd({...nd,n:d.n,g:d.g,u:d.u,p:d.p});setShowSugg(false);}}>
                      <div className="acn">{d.n}</div><div className="acm">{d.g} · ฿{d.p}/{d.u}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="f2">
              <div className="fg"><label className="fl">หน่วย</label><select className="fi fsel" value={nd.u} onChange={e=>setNd({...nd,u:e.target.value})}>{UNITS.map(u=><option key={u}>{u}</option>)}</select></div>
              <div className="fg"><label className="fl">ราคา/หน่วย</label><input className="fi" type="number" min="0" step="0.01" value={nd.p} onChange={e=>setNd({...nd,p:e.target.value})}/></div>
            </div>

            {/* Lot & Exp */}
            <div className="f2">
              <div className="fg"><label className="fl">เลขล็อต</label><input className="fi" placeholder="Lot number" value={nd.lot} onChange={e=>setNd({...nd,lot:e.target.value})}/></div>
              <div className="fg"><label className="fl">วันหมดอายุ</label><input className="fi" type="date" value={nd.exp} onChange={e=>setNd({...nd,exp:e.target.value})}/></div>
            </div>

            {/* Good / Bad qty */}
            <div style={{background:"#fff",borderRadius:"var(--r1)",padding:"10px 12px",marginTop:10,border:"1px solid var(--bdl)"}}>
              <div style={{fontSize:12,fontWeight:800,color:"#444",marginBottom:8}}>📦 จำนวนที่รับ</div>
              <div className="f2">
                <div className="fg">
                  <label className="fl" style={{color:"var(--G)"}}>✅ ยาดี (ส่งคืนผู้ป่วย)</label>
                  <input className="fi" type="number" min="0" value={nd.goodQty} onChange={e=>setNd({...nd,goodQty:+e.target.value})} style={{borderColor:"var(--G)"}}/>
                </div>
                <div className="fg">
                  <label className="fl" style={{color:"var(--R)"}}>❌ ยาเสีย (ทำลาย)</label>
                  <input className="fi" type="number" min="0" value={nd.badQty} onChange={e=>setNd({...nd,badQty:+e.target.value})} style={{borderColor:"var(--R)"}}/>
                </div>
              </div>
              <div style={{marginTop:6,fontSize:12,color:"var(--txm)"}}>รวม: {(+nd.goodQty||0)+(+nd.badQty||0)} {nd.u}</div>
            </div>

            <div className="fbtns">
              <button className="btn b-ol b-md" onClick={closeItemForm}>ยกเลิก</button>
              <button className="btn b-md" style={{flex:1,background:"var(--V)",color:"#fff"}} onClick={saveItem}>{editItemId?"💾 บันทึก":"✅ เพิ่ม"}</button>
            </div>
          </div>
        )}

        {!showItemForm&&(
          <button className="dadd" style={{borderColor:"var(--V)",color:"var(--V)",marginTop:8}} onClick={()=>openItemForm(null)}>➕ เพิ่มรายการยา</button>
        )}

        {/* Summary bar */}
        {items.length>0&&!showItemForm&&(
          <div className="dmini" style={{marginTop:12}}>
            <div style={{color:"var(--G)"}}>✅ ยาดี {goodItems.length} รายการ · ฿{fmt(goodItems.reduce((s,x)=>s+x.goodQty*x.p,0))}</div>
            <div style={{color:"var(--R)"}}>❌ ยาเสีย {badItems.length} รายการ · ฿{fmt(items.reduce((s,x)=>s+(x.badQty||0)*x.p,0))}</div>
          </div>
        )}
      </div>

      {/* Action buttons */}
      {!showItemForm&&(
        <div style={{padding:"16px 12px",display:"flex",gap:10}}>
          <button className="btn b-ol b-md" onClick={goList}>ยกเลิก</button>
          <button className="btn b-md" style={{flex:1,background:"var(--V)",color:"#fff"}} onClick={saveSession}>
            {editingSession?"💾 บันทึกแก้ไข":"💾 บันทึกนับยา"}
          </button>
        </div>
      )}
    </div>
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
